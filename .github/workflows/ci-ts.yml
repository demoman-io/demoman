name: CI (TypeScript)

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "brand/**"
      - "apps/runner/**"
      - "apps/mcp/**"
      - "apps/studio/**"
      - "apps/cli/**"
      - "scripts/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "biome.json"
      - "tsconfig.base.json"
      - ".github/workflows/ci-ts.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "packages/**"
      - "brand/**"
      - "apps/runner/**"
      - "apps/mcp/**"
      - "apps/studio/**"
      - "apps/cli/**"
      - "scripts/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "biome.json"
      - "tsconfig.base.json"
      - ".github/workflows/ci-ts.yml"
      - ".github/actions/**"

# A newer push to a pull request replaces the run in flight: nobody reads
# the result of a commit that is no longer its head. Not on main: there each
# commit keeps its own verdict, so a quick second push cannot hide that the
# first one broke it (review, 2026-10-17).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs the full tier: CI is the gate `pnpm test:fast` never is
# (scripts/test-tier.mjs).
env:
  DEMOMAN_TEST_TIER: full

# One machine per heavy lane. Until 2026-10-17 this was one job, its steps
# in series: the runner's headless 4K renders and the studio's real export
# had to run apart from the (since archived) extension's browser windows,
# because on one runner they raced the same CPU at its ~5x. It also meant
# the runner and studio steps were skipped whenever the extension step
# failed, which was every run from 2026-10-08 to 2026-10-17. Here each job
# has its own machine, and a red one does not hide the others.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build: "false"
      - run: pnpm exec biome ci .
      - run: pnpm -r build
      # After the build, never before: the apps resolve @demoman/* types
      # from their gitignored dist/, so a typecheck on an unbuilt tree fails
      # on missing modules rather than on anything real.
      #
      # Whole-repo: every workspace defines `typecheck`, and the root script
      # is `pnpm -r --if-present typecheck`. Each package checks `src` +
      # `test` + `scripts` through its own tsconfig.check.json, because the
      # build tsconfig includes `src` alone and widening it would emit test
      # files into dist/.
      - name: Typecheck
        run: pnpm typecheck
      - name: The root scripts' own tests
        run: node --test 'scripts/*.test.mjs'
      # The runner's shards exclude every refresh part, so a part missing
      # from the refresh job's matrix would never run, and nothing would say.
      - name: Every refresh part has a job
        run: |
          for f in apps/runner/test/refresh-*.slow.test.ts; do
            p=${f##*/refresh-}; p=${p%.slow.test.ts}
            grep -qE "part: \[.*\b$p\b" .github/workflows/ci-ts.yml || { echo "::error::$f is in no refresh job of ci-ts.yml"; exit 1; }
          done
      - name: Generated JSON Schema is up to date
        run: |
          pnpm --filter @demoman/scene-schema gen-schema
          git diff --exit-code packages/scene-schema/schema.gen.json

  # The packages and the runner run on macOS too: until 2026-11-11 the only
  # macOS check was the author's local `pnpm test`, a slower copy of this
  # workflow that held the laptop for ~25 min before every push (DEM-149).
  # Five macOS jobs, the free plan's macOS concurrency. The refresh lane
  # stays on Linux: five more macOS jobs would queue behind these.
  #
  # Not blocking yet: their first run (2026-11-11) failed two tests that pass
  # on Linux and on the author's Mac, DEM-151 (account-signin's 10 s wait)
  # and DEM-152 (studio-shots' zoom block). A red macOS job still shows red
  # on the run; it does not fail it. Drop `continue-on-error` once both are
  # fixed.
  packages:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      # One package at a time, as test:heavy runs them locally: since
      # 2026-10-20 replay-engine's integration lane and run-core's browser
      # lane (from the archived extension's job) sit here beside the
      # compositor's and resolver's, all launching a real Chromium, and side
      # by side they would race for the CPU as the studio's lane did below.
      - name: Tests (every package but the runner and the studio)
        run: pnpm -r --workspace-concurrency=1 --filter '!@demoman/runner' --filter '!@demoman/studio' test
      # After the others, not beside them: its browser lane
      # (test/browser/studio-edit-export.test.ts) drives a real Chrome
      # through a real render and export, and under -r it raced the other
      # packages' browser lanes for the same CPU at this runner's 5x.
      - name: Tests (the studio)
        run: pnpm --filter @demoman/studio test
      # The pages' browser lane writes a screenshot for each failed case;
      # without this they die with the runner and a red run arrives
      # without them.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-pages-failure-screenshots-${{ matrix.os }}
          path: apps/studio/test/pages/browser/__screenshots__/
          if-no-files-found: ignore

  # vitest's --shard splits the lane's files across these jobs, each file in
  # exactly one of them, by path rather than by how long it takes. So the
  # refresh lane's parts run on machines of their own below: as one file
  # it was 3012 s of its shard's 3014 s (run 41224304573, 2026-10-31).
  # Standard runners cost nothing on this public repo; more of them is free.
  runner:
    runs-on: ${{ matrix.os }}
    # macOS not blocking yet: DEM-151, DEM-152 (above the packages job).
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - name: Tests (the runner, shard ${{ matrix.shard }} of 4)
        run: pnpm --filter @demoman/runner test --shard=${{ matrix.shard }}/4 --exclude 'test/refresh-*.slow.test.ts'

  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [unchanged, restyle, replace, own, dates, settle]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - name: Tests (the runner's refresh lane, ${{ matrix.part }})
        run: pnpm --filter @demoman/runner test test/refresh-${{ matrix.part }}.slow.test.ts
