<!-- apps/studio/pages/entrypoints/library/index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flows - Demoman</title>
    <!-- The shell — tokens, faces, the top bar and tabs, cards, buttons, notices
         — is shared with the popup. Only this page's own rules are inline
         below. -->
    <link rel="stylesheet" href="../../assets/shell.css" />
    <style>
      /* Wide, on purpose — a 720px column left a third of a laptop screen
         empty on each side — but capped, so on a big monitor the page
         sits centred with clear margins rather than running edge to edge.
         The cap is the shell's `.page`, shared with the bar above it:
         1280 less two 32px gutters holds four 270px cards with their
         gaps. */
      body { font-size: 14px; }
      #notice { margin-bottom: 16px; }

      /* Settings' shape since 2026-10-08: a left column with the title and
         a jump list of the sections, held in view on a wide window; the
         list beside it. The list's column starts the title's height lower
         — its 36px line and 28px under it — so the first section sits
         level with the jump list and the title reads as the page's. One column under 1024px, not Settings' 768: the list is a
         grid of 270px cards, and beside a column at 800px it had room for
         one. The storage trigger is in the top bar. */
      .library { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
      .library-side {
        align-self: start;
        min-width: 0;
        /* On the dotted ground, not a card: the ground's opaque control
           tones, or the dots show through a dark theme's translucent ones. */
        --control: var(--control-ground);
        --control-hover: var(--control-hover-ground);
      }
      .library-content { min-width: 0; }
      /* Under 1024px the rail is not drawn: a full column of places above
         the list took most of the window (the author, 2026-11-01). The
         title is a button that opens the same places as a menu instead
         (view.ts). Wide, the switcher is not drawn. */
      .place-switch { display: none; }
      @media (max-width: 1023px) {
        [data-rail] { display: none; }
        .place-switch:not([hidden]) {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          max-width: 100%;
          padding: 0;
          border: 0;
          background: transparent;
          color: inherit;
          font: inherit;
          letter-spacing: inherit;
          cursor: pointer;
        }
        .place-switch:not([hidden]) + [data-place-title] { display: none; }
      }
      /* Shrinks, so the name's own ellipsis (.place-name) has a width to
         keep to; not clipped itself, or the glyphs' descenders go. */
      .place-switch-name { min-width: 0; }
      .place-switch svg {
        flex: none;
        width: 20px;
        height: 20px;
        color: var(--ink-faint);
        transition: transform 120ms ease;
      }
      .place-switch[aria-expanded="true"] svg { transform: rotate(180deg); }
      @media (min-width: 1024px) {
        .library { grid-template-columns: 184px minmax(0, 1fr); gap: 48px; }
        /* Held, and never taller than the window: a long rail scrolls
           itself rather than running off the foot of the screen. The rail,
           not the column, so the title band's name can run on past the
           column into the band. */
        .library-side {
          position: sticky;
          top: 24px;
          max-height: calc(100vh - 48px);
          display: flex;
          flex-direction: column;
        }
        [data-rail] { min-height: 0; overflow-y: auto; }
        .library-content { padding-top: calc(36px + 28px); }
        .side-list { flex-direction: column; }
      }
      h1 {
        margin: 0 0 28px;
        font: 700 30px/1.2 "Outfit", ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -0.02em;
      }
      /* The project rail's places (All flows, each owner's projects, No
         project, Couldn't read): the place shown (aria-current) in the
         stronger control tone, the rest muted text that firms under the
         pointer, a count at the end. */
      /* A column at every width: wrapped into rows, the last projects of one
         owner shared a row with "No project" and read as that owner's. */
      .side-list { display: flex; flex-direction: column; gap: 2px; }
      .side-item {
        display: flex; align-items: center; gap: 8px;
        min-width: 0;
        padding: 7px 10px;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--ink-muted);
        font: inherit;
        font-size: 13px; font-weight: 600;
        text-align: left;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 120ms ease, color 120ms ease;
      }
      .side-item:hover { color: var(--ink); background: var(--control); }
      .side-item[aria-pressed="true"],
      .side-item[aria-current="true"] { color: var(--ink); background: var(--control-hover); }
      .side-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .side-count { margin-left: auto; font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
      .meter {
        height: 4px;
        border-radius: 999px;
        background: var(--control-hover);
        overflow: hidden;
      }
      .meter-fill {
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
      }
      .meter[data-full] .meter-fill { background: var(--warn); }

      /* The trigger: the meter, the sentence and a chevron in one quiet
         button. It opens the storage panel (view.ts) and points up while
         the panel is open. Its bar sits on the button's own control tone,
         so the track steps once more to stay visible under the pointer. */
      .storage-trigger {
        gap: 10px;
        color: var(--ink-muted);
        font-weight: 500;
      }
      .storage-trigger:hover,
      .storage-trigger[data-open] { color: var(--ink); }
      .storage-trigger[data-open] { background: var(--control-hover); }
      .storage-trigger .meter {
        width: 72px;
        background: var(--ring-strong);
      }
      [data-meter] { font-variant-numeric: tabular-nums; }
      /* The word that says what the bar measures, in the button's own
         stronger ink, so it reads as the label and the figure as its value. */
      .storage-label { color: var(--ink); font-weight: 600; }
      /* The studio's total in the same slot: the word and the figure, not a
         button. The word keeps .storage-label's ink; the figure is muted. */
      .library-total {
        display: inline-flex;
        gap: 8px;
        align-items: baseline;
        color: var(--ink-muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .storage-trigger svg {
        width: 14px;
        height: 14px;
        transition: transform 120ms ease;
      }
      /* In the top bar since 2026-10-08, left of the theme switch: under
         900px the words go and the bar and chevron stay, so the bar's
         right end still fits beside the tabs. The button's label carries
         the numbers either way. */
      @media (max-width: 899px) {
        .storage-trigger .storage-label,
        .storage-trigger [data-meter] { display: none; }
      }
      /* And under 560px, the shell's last step (shell.css, the bar), the
         meter shortens, so a phone-width bar keeps one line. */
      @media (max-width: 559px) {
        .storage-trigger .meter { width: 44px; }
      }
      .storage-trigger[data-open] svg { transform: rotate(180deg); }

      /* The panel: a popover in the top layer, so it floats over the list
         instead of pushing it down. Placed by the script — absolute, so it
         scrolls with the trigger — and edged as the split button's menu
         is: a hairline ring under the overlay shadow. It floats over cards
         of its own tone, and in dark the shadow alone is lost on the black
         page, so the panel's edge ran into the card beneath it. No
         `display` here: the UA's `[popover]:not(:popover-open)` is what
         keeps it hidden. */
      .storage-panel,
      .place-menu {
        position: absolute;
        /* Capped to the room beside its trigger by view.ts's placePanel
           when it does not fit; it scrolls inside then. */
        overflow-y: auto;
        box-sizing: border-box;
        inset: auto;
        margin: 0;
        padding: 16px;
        border: 0;
        border-radius: var(--radius-card);
        background: var(--card);
        color: var(--ink);
        box-shadow:
          0 0 0 1px var(--ring),
          var(--shadow-overlay);
        font-size: 13px;
      }
      /* The switcher's menu: the storage panel's surface, holding the rail's
         own rows. */
      .place-menu { padding: 4px; }
      /* Manrope since 2026-10-06, as every heading under the page title is:
         Outfit is the page title's and the dialogs'. */
      .storage-title {
        margin: 0 0 12px;
        font: 700 15px/1.3 "Manrope", ui-sans-serif, system-ui, sans-serif;
      }
      .storage-used {
        margin: 6px 0 0;
        color: var(--ink-muted);
        font-variant-numeric: tabular-nums;
      }
      .storage-field { margin-top: 16px; }
      .storage-field label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-muted);
      }
      .storage-budget-row {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-muted);
      }
      .storage-budget-row input {
        width: 6em;
        font-variant-numeric: tabular-nums;
      }
      .storage-hint {
        margin: 6px 0 0;
        font-size: 12px;
        line-height: 1.4;
        color: var(--ink-faint);
      }
      .storage-field .notice { margin-top: 8px; }
      .storage-foot {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--ring);
      }
      .storage-reclaim { width: 100%; }
      .storage-reclaim svg { width: 14px; height: 14px; }

      [data-notices] > .notice { margin: 0 0 16px; }

      /* The list, in sections by when the take was made: Today, Yesterday,
         the last week by weekday, then a month at a time (view.ts,
         state.ts's sectionsOf). Each section is a fold whose summary is
         its heading and count; every section starts open, and its
         chevron closes it. */
      /* Settings' rhythm (2026-10-06): 28px from the title block to the
         first day; 40px after a day that is open, Settings' gap between
         sections; 8px between closed ones. */
      .section { margin-top: 8px; }
      .library-content > .section:first-of-type { margin-top: 0; }
      .section[open] + .section { margin-top: 40px; }

      /* A section's summary: Settings' chevron, the heading, its count. */
      .section-head {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        width: fit-content;
        padding: 4px 8px 4px 0;
        border-radius: var(--radius);
      }
      .section-head::-webkit-details-marker { display: none; }
      .section-head:hover .chev { color: var(--ink); }
      .section[open] > .section-head .chev { transform: rotate(90deg); }
      /* Settings' section heading: Manrope 700 at 20px, where it was Outfit
         at 15px until 2026-10-06. */
      .section-head h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.3;
      }
      .section-count {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-faint);
        font-variant-numeric: tabular-nums;
      }

      /* The cards under a heading. Each recording is one card with its
         thumbnail on top, and the card answers the pointer: a firmer ring
         and a lifted shadow, nothing that moves. A grid of equal columns,
         as many 270px-or-wider columns as fit (two at 800px, four at the
         1200 cap), left on the heading's own edge — a heading anchors the
         left, so the centred wrap the flat gallery had (03cddd4) would
         float a partial row away from it. A grid also keeps a partial last
         row's cards in their columns, at the columns' width. */
      .rows {
        display: grid;
        /* min(270px, 100%): a track cannot shrink below its minimum, so
           a bare 270px would scroll a viewport narrower than that sideways. */
        grid-template-columns: repeat(auto-fill, minmax(min(270px, 100%), 1fr));
        gap: 14px;
        /* Each card its own height: a video's versions opened under one
           card must not stretch its neighbours to match. */
        align-items: start;
      }
      /* The cards sit 14px under their day, as a card sits under its
         title on Settings. */
      .section > .rows { margin-top: 14px; }
      article.card {
        /* The whole card opens the editor (view.ts); the name inside it is
           a field, and says so with its own cursor below. */
        cursor: pointer;
        /* min-width: 0 is load-bearing — a grid item's automatic minimum
           is its min-content width, and the one-line meta below makes that
           the whole host and path, which took a card in a 360px column to
           430px and out the side. */
        min-width: 0;
        display: flex;
        flex-direction: column;
        /* No padding: the thumbnail runs to the card's edges, and the card
           clips it to its own corners. The text below carries its own. */
        padding: 0;
        overflow: hidden;
        transition: background-color 120ms ease;
      }
      /* Hover was a stronger ring and a lift until 2026-09-20; flat, it is
         a tone step instead. Mixed against `--ink`, NOT `--control`: in
         dark `--control` is a translucent white, and as the card's OWN
         background it composites over the page behind it rather than over
         the card — measured 1.042:1, a highlight nobody can see. Mixing
         with the theme's ink darkens in light and lightens in dark, which
         is the same gesture in both (1.151 / 1.200). */
      article.card:hover {
        background: color-mix(in srgb, var(--ink) 7%, var(--card));
      }

      /* The thumbnail: the take's first keyframe at rest, a flipbook of
         its keyframes while the pointer is anywhere on the card
         (src/library/preview.ts). Edge to edge across the top of the card
         since 2026-10-05; it was a padded well inside the card until then.
         No surface of its own and no hairline under it, also since
         2026-10-05: the control tone showed in a letterboxed keyframe's
         bars as a grey mat around the picture, and the author preferred
         the bare image. A fixed 16:9 so the grid's rows line up; a
         keyframe of another shape letterboxes inside it rather than
         stretching, and its bars are the card's own colour.
         The picture itself carries a hairline (D3 shots, L2): a mostly white
         page pillarboxed on a white card had no edge at all. The canvas is
         sized to the picture (`--thumb-ratio`, set by preview.ts) rather
         than to the box, and the box clips the ring — so it shows only
         where the picture meets a bar, and a picture that fills the box
         stays bare, with no line under it. */
      [data-preview] {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        container-type: size;
      }
      [data-preview-canvas] {
        display: block;
        width: min(100cqw, 100cqh * var(--thumb-ratio, 16 / 9));
        height: auto;
        object-fit: contain;
        box-shadow: 0 0 0 1px var(--ring);
      }
      /* `display: block` above beats the UA's `[hidden] { display: none }`
         — an author rule wins over the UA sheet whatever its specificity —
         so without this the hidden canvas kept its 100% width and shoved
         the note out of the box's right edge, clipped. */
      [data-preview-canvas][hidden] { display: none; }
      [data-preview-note] {
        padding: 0 10px;
        text-align: center;
        font-size: 12px;
        line-height: 1.4;
        color: var(--ink-faint);
      }
      [data-preview-note]:empty { display: none; }

      /* The export's length, on the picture's bottom-right corner, the way
         every video player and file browser puts it. A dark scrim with
         white figures in both themes, not a theme surface: it sits on a
         screenshot, which is whatever colour the recorded page was. In the
         page's Manrope with tabular figures since 2026-10-08, as the
         editor's clock is — not `--font-mono`. */
      [data-duration] {
        position: absolute;
        right: 8px;
        bottom: 8px;
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.72);
        color: #ffffff;
        font-size: 11px;
        line-height: 1.4;
        font-variant-numeric: tabular-nums;
      }
      [data-duration][hidden] { display: none; }

      /* The tags ride on the picture's bottom-left, opposite the length.
         Stays put whatever the pointer does: a reclaimed take has to say
         so without being hovered. Room kept on the right for the length,
         so a tag never runs under it. */
      .row-tags {
        position: absolute;
        left: 8px;
        right: 64px;
        bottom: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-width: 0;
      }
      /* `.tag`, not `.chip`: on Settings a chip is the round on/off icon. */
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 8px 2px 6px;
        border-radius: var(--radius);
        /* The card's own surface under the tag's tone: on a picture, a
           translucent dark-theme `--control` would take its colour from
           the screenshot behind it. */
        background:
          linear-gradient(var(--control), var(--control)),
          var(--card);
        color: var(--ink-muted);
        font-size: 11px;
        font-weight: 600;
        /* A whole pixel, so every tag stands 20px and the glyph-only Needs
           a look flag below can be a 20px square level with them. The
           inherited 1.5 made it 20.5. */
        line-height: 16px;
        /* One line, always: a tag that wraps mid-word is a broken pill. */
        white-space: nowrap;
      }
      .tag svg { width: 12px; height: 12px; }
      .tag-warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      /* Needs a look: the one tag that is a button, and a glyph alone — so
         a square, the 20px every worded tag stands. */
      .tag-look {
        justify-content: center;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        cursor: pointer;
      }
      .tag-look svg { width: 14px; height: 14px; }
      .tag-look:hover { filter: brightness(0.96); }
      .tag-look:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .row-text {
        min-width: 0;
        padding: 8px 8px 12px 12px;
      }
      /* The name and the actions on one line. The name takes what the
         actions leave, and clips. */
      .row-title {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
      }
      /* The take's name, editable in place: the editor's own name field,
         in the card. Pulled back by its own 4px padding so the text sits on
         the card's text edge, and the ring appears around it. */
      [data-name] {
        display: block;
        flex: 1;
        min-width: 0;
        margin-left: -4px;
        padding: 2px 4px;
        text-overflow: ellipsis;
        font: inherit;
        /* 14px since 2026-10-06, the size of an item's name on Settings. */
        font-size: 14px;
        font-weight: 700;
        line-height: 1.3;
        color: inherit;
        background: transparent;
        border: 1px solid transparent;
        border-radius: var(--radius);
        cursor: text;
      }
      /* An untitled take: "Untitled" in the row's quiet ink, so it reads as
         a state rather than as a name somebody chose. */
      [data-name]::placeholder { color: var(--ink-muted); opacity: 1; }
      [data-name]:hover { border-color: var(--ring); }
      [data-name]:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--control);
      }
      /* A flow's checkbox, for a bulk delete (spec 2026-10-30
         flows-and-bulk-delete §1.2): in the thumbnail's corner, shown on
         the card's hover or its own focus, and on every flow card once
         one is ticked. Opacity, not display: Tab still reaches it. */
      .select-box {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 1;
        width: 18px;
        height: 18px;
        margin: 0;
        accent-color: var(--ink);
        cursor: pointer;
        opacity: 0;
        transition: opacity 120ms ease;
      }
      article.card:hover .select-box,
      .select-box:focus-visible,
      [data-selecting] .select-box {
        opacity: 1;
      }
      /* While flows are ticked the bar's Delete is the one Delete on the
         page: a flow card's own Edit and Delete step aside. Hidden by the
         selecting state, not left out of the render, so a tick changes
         nothing but attributes (view.ts, applySelection). */
      [data-selecting] article[data-video] :is([data-action="edit"], [data-action="delete"]) {
        display: none;
      }
      /* The list's own: in its cell, not the thumbnail's corner; shown as
         the card's is, on its row's hover or keyboard focus (list spec
         §4.4) — not a click's focus, which outlasts the pointer. */
      .library-list .select-box {
        position: static;
        /* Not the thumbnail's 1: a flex item takes a z-index unpositioned,
           and the boxes painted over the sticky head as rows scrolled
           under it. A heading's box is lifted by its cell (below). */
        z-index: auto;
      }
      .library-list > [data-key]:is(:hover, :focus-visible, :has(:focus-visible)) .select-box {
        opacity: 1;
      }
      /* A grid section's own: in its head, left of the label, shown on the
         head's hover or focus and while flows are ticked (the list's heading
         box is shown by its row's hover, above). */
      .section-head .select-box {
        position: static;
        flex: none;
      }
      .section-head:is(:hover, :focus-within) .select-box {
        opacity: 1;
      }
      article.card[data-selected] {
        box-shadow: inset 0 0 0 2px var(--ink);
      }
      /* Stands over the list while flows are ticked, and stays in view as
         the list scrolls under it. */
      .selection-bar {
        position: sticky;
        top: 12px;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        padding: 8px 8px 8px 14px;
        border-radius: 10px;
        background: var(--card);
        box-shadow: inset 0 0 0 1px var(--ring);
      }
      .selection-count {
        flex: 1;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .selection-said {
        flex-basis: 100%;
        margin: 0;
        color: var(--ink-muted);
        font-size: 13px;
      }
      /* Quiet glyphs beside the name, not filled buttons: at rest the card
         is a picture and two lines, and four tinted squares would be the
         loudest thing on it. The tone comes with the pointer. */
      .row-actions {
        display: flex;
        align-items: center;
        gap: 2px;
        flex: none;
      }
      .row-actions .btn-icon {
        width: 28px;
        height: 28px;
        background: transparent;
        color: var(--ink-muted);
      }
      .row-actions .btn-icon:not(:disabled):hover {
        background: var(--control-hover);
        color: var(--ink);
      }
      .row-actions .btn-icon[aria-disabled="true"]:hover {
        background: transparent;
        color: var(--ink-muted);
      }
      /* Delete keeps the shell's red hover. Restated here because the rule
         above matches it at the same specificity as the shell's own
         `.btn-icon.btn-danger` hover, and wins by coming later. */
      .row-actions .btn-icon.btn-danger:not(:disabled):hover {
        background: var(--error-soft);
        color: var(--error);
      }

      /* Where and when, and the size, in one place: both sit in the same
         grid cell and trade opacity, so the line never changes height and
         nothing below it moves. */
      .row-line {
        display: grid;
        margin-top: 2px;
        font-size: 13px;
      }
      .row-line > * {
        grid-area: 1 / 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: opacity 120ms ease;
      }
      .row-meta { color: var(--ink-muted); }
      .row-size {
        color: var(--ink-muted);
        font-variant-numeric: tabular-nums;
      }
      /* At rest a card is its thumbnail, its name, and where and when. The
         size and the actions come with the pointer, or with focus anywhere
         in the card, so the keyboard reaches them too. Opacity rather than
         visibility or display: they keep their space, so nothing in the
         card moves, and the actions stay in the tab order — a Tab into a
         hidden button is what reveals it. */
      .row-size,
      .row-actions {
        opacity: 0;
        transition: opacity 120ms ease;
      }
      article.card:hover .row-size,
      article.card:hover .row-actions,
      article.card:focus-within .row-size,
      article.card:focus-within .row-actions {
        opacity: 1;
      }
      article.card:hover .row-meta,
      article.card:focus-within .row-meta {
        opacity: 0;
      }
      /* A device with no pointer that hovers — a touchscreen Chromebook —
         never reveals them, and an invisible Delete is still where a tap
         lands. There they stay in view, and the two sentences stack rather
         than share a place, since nothing would ever swap them. */
      @media (hover: none) {
        .row-size,
        .row-actions,
        article.card .row-meta,
        article.card:focus-within .row-meta {
          opacity: 1;
        }
        .row-line > .row-size { grid-area: 2 / 1; }
        .select-box { opacity: 1; }
      }
      article.card [data-status] { margin: 0 12px 12px; }
      /* A video's versions, under its card: the count is the fold, and
         each version a line of its number, when, and its actions. */
      .versions { padding: 0 8px 8px 12px; cursor: default; }
      .versions-count {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
        width: fit-content;
        font-size: 12.5px;
        color: var(--ink-muted);
      }
      .versions-count::-webkit-details-marker { display: none; }
      .versions > .versions-count > .chev { width: 14px; height: 14px; }
      .versions-count:hover .chev { color: var(--ink); }
      .versions[open] > .versions-count .chev { transform: rotate(90deg); }
      .versions-list { list-style: none; margin: 6px 0 0; padding: 0; }
      .version-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
        font-size: 12.5px;
      }
      .version-number { font-variant-numeric: tabular-nums; }
      .version-when {
        flex: 1;
        min-width: 0;
        color: var(--ink-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* The commit the version filmed, beside its day. */
      .version-commit { flex: none; color: var(--ink-muted); }
      .version .row-rerun { margin: 0 0 6px; font-size: 12px; color: var(--ink-muted); }
      article.card .version [data-status] { margin: 0 0 6px; }
      .version-exports { list-style: none; margin: 0 0 6px; padding: 0; }
      .version-exports li {
        display: flex;
        gap: 8px;
        font-size: 12px;
        color: var(--ink-muted);
      }
      .version-exports .export-name {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .version-exports [data-gone] .export-name { text-decoration: line-through; }
      /* A folder the studio could not read is a row of words, not a take:
         its name, the reason and the size are what it says, so none of
         them trades places with the others at rest or under the pointer
         (the take card's swap above hid the size at rest and the name and
         reason while reaching for Delete). The reason names whole paths,
         which have nowhere to break, so it may break anywhere rather than
         run past the card. */
      article.card[data-unreadable-row]:is(*, :hover, :focus-within)
        :is(.row-meta, .row-size) {
        opacity: 1;
      }
      article.card[data-unreadable-row] [data-reason] { overflow-wrap: anywhere; }

      /* The list view (list spec §2.1, §4.7): a treegrid whose rows are
         subgrids of one column template, so a column lines up down the
         list whatever its cells hold. Narrow lists drop columns rather
         than scroll sideways — Size, then Length, then Videos — and Where,
         the one track with no floor, truncates before any of them goes.
         The widths are the list's own (a container), not the window's:
         the side column comes and goes at 1024px. */
      .library-content { container: library / inline-size; }
      /* The tab row: In repo · Not in repo · All at the left, List or
         Grid at the right, even when the tabs are hidden. */
      .tabs-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }
      /* The tabs keep one line: under a 600px list the box folds (below)
         rather than push them onto two. */
      .place-tabs { display: flex; gap: 4px; }
      .layout-toggle {
        display: flex;
        justify-content: flex-end;
        gap: 2px;
        margin-left: auto;
      }
      /* Above the studio stylesheet's transparent `.btn-quiet.btn-icon`. */
      .layout-toggle .btn.btn-icon[aria-pressed="true"] {
        background: var(--control-hover);
        color: var(--ink);
      }
      /* The search box, right of the tabs and before the toggle: the
         system's field, its glyph inside the left edge and the `/` hint
         inside the right (the Studio sheet pads the text clear of both).
         Under a 600px list it folds to its glyph (below). */
      .search-field {
        position: relative;
        display: flex;
        align-items: center;
        flex: 0 1 260px;
        min-width: 180px;
        margin-left: auto;
      }
      .search-field:not([hidden]) + .layout-toggle { margin-left: 0; }
      .search-field > input { width: 100%; }
      .search-field > :is(svg, kbd) {
        position: absolute;
        pointer-events: none;
        color: var(--ink-faint);
      }
      .search-field > svg { left: 10px; width: 14px; height: 14px; }
      .search-field > kbd {
        right: 8px;
        min-width: 18px;
        padding: 0 4px;
        border-radius: 4px;
        box-shadow: inset 0 0 0 1px var(--line-2);
        font-family: inherit;
        font-size: 11px;
        line-height: 18px;
        text-align: center;
      }
      .search-field:focus-within > kbd { display: none; }
      /* Under a 600px list, where the box would wrap under the tabs: empty
         and unfocused it is its glyph alone, a pill's height square, still
         the input (a press focuses it); focused it opens across the row
         over the tabs, up to the toggle; holding a query it keeps the room
         between the tabs and the toggle, so the query is always in view.
         The Studio sheet takes the input's padding (as specific as its
         own). The `/` hint goes: there is no room for it. */
      @container library (max-width: 599px) {
        .tabs-row { position: relative; flex-wrap: nowrap; }
        .place-tabs .btn { white-space: nowrap; }
        .search-field { flex: 1 1 0; min-width: 32px; margin-left: 0; }
        .search-field > kbd { display: none; }
        /* The toggle keeps the row's end, the box in the row or over it;
           folded, the glyph stands beside it (the approved mockup). */
        .search-field:not([hidden]) + .layout-toggle { margin-left: auto; }
        .search-field:not(:focus-within):has(> input:placeholder-shown) {
          flex: 0 0 32px;
          margin-left: auto;
        }
        .search-field:not(:focus-within):has(> input:placeholder-shown) + .layout-toggle {
          margin-left: 0;
        }
        .search-field:not(:focus-within) > input:placeholder-shown {
          cursor: pointer;
        }
        .search-field:not(:focus-within) > input::placeholder { color: transparent; }
        /* Open over the row, up to the toggle: its two 32px buttons and
           their 2px (shell.css `.btn-icon`, `.layout-toggle` above) and
           the row's 12px gap. With no toggle, to the row's end. */
        .search-field:focus-within {
          position: absolute;
          top: 0;
          left: 0;
          right: calc(66px + 12px);
          z-index: 2;
        }
        .search-field:focus-within:has(+ .layout-toggle[hidden]) { right: 0; }
      }
      /* A phone's list: tighter tabs (the Studio sheet's padding), the
         toggle's one button the layout not shown, and no room beside the
         tabs, so a held query keeps the box open over them until cleared.
         At 480 the box beside the tabs is about 112px, its query 72; at
         440 it was 32, too little to read "invite" whole. */
      @container library (max-width: 479px) {
        .tabs-row { gap: 8px; }
        /* Three-digit counts do not fit a phone's row: the tabs scroll
           sideways inside their strip, with no scrollbar, rather than push
           the toggle past the list's end; view.ts keeps the pressed one in
           view. The 4px of padding, given back by the margin, is room for
           a tab's focus ring, which the strip's clip would cut. */
        .place-tabs {
          gap: 2px;
          min-width: 0;
          margin: -4px;
          padding: 4px;
          overflow-x: auto;
          scrollbar-width: none;
        }
        .layout-toggle .btn[aria-pressed="true"] { display: none; }
        /* Open over the tabs, up to the toggle's one 32px button and the
           row's 8px gap. With no toggle, to the row's end. */
        .search-field:is(:focus-within, :not(:has(> input:placeholder-shown))) {
          position: absolute;
          top: 0;
          left: 0;
          right: calc(32px + 8px);
          z-index: 2;
        }
        .search-field:is(:focus-within, :not(:has(> input:placeholder-shown))):has(
            + .layout-toggle[hidden]
          ) {
          right: 0;
        }
        /* While a tab holds the keys, a held box steps aside to its glyph
           beside the toggle, so the focused tab is not under it; it is
           still the input, the next Tab stop. The Studio sheet hides its
           text while it is folded so. */
        .tabs-row:has(> .place-tabs:focus-within) > .search-field:not(:focus-within) {
          position: relative;
          flex: 0 0 32px;
          margin-left: auto;
        }
        .tabs-row:has(> .place-tabs:focus-within) > .search-field:not(:focus-within) + .layout-toggle {
          margin-left: 0;
        }
      }
      /* Why a search found a flow: dim, after the name or in Where's
         place, cut before the name is. */
      .match-why {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ink-faint);
      }
      /* The why keeps its width and the name gives way, down to a floor
         of 35% of the cell: 56px of name at the narrowest (160px), where
         40% cut a five-letter matched word (the name's rule is with the
         name's, below). A longer why is cut after the floor, its 12px and
         the gap of 8, and starts at the matched word (`whyOf`). */
      .library-list [data-col="name"] > .match-why {
        flex: none;
        max-width: calc(65% - 20px);
        margin-left: 12px;
      }
      /* Wide, the why follows the name; the copy in Where waits. */
      .library-list [data-col="where"] > .match-why { display: none; }
      /* Chrome's own clear button: Esc clears, and the box adds nothing. */
      .search-field > input::-webkit-search-cancel-button {
        -webkit-appearance: none;
        appearance: none;
        display: none;
      }
      .none-here { margin: 28px 0 0; color: var(--ink-muted); }
      /* A search's cards: one run, spaced from the tabs as a section's are. */
      .rows[data-results] { margin-top: 14px; }
      :is(.library-list, .unreadable-list) {
        --list-row: 34px;
        /* Wide enough for a video row's "Sep 26, 11:00 AM": as content
           width, opening a flow widened it and moved every column left. */
        --recorded: 9em;
        --gap: 24px;
        display: grid;
        /* Select, open, Name, Where, Videos, Length, Size, Recorded: the
           numbers together and the date at the row's end. The actions
           hold no track; they float over the row's end (below). */
        grid-template-columns:
          28px 20px minmax(160px, 3fr) minmax(0, 2fr)
          56px 64px 72px var(--recorded);
        column-gap: var(--gap);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .library-list > [role="row"] {
        display: grid;
        grid-column: 1 / -1;
        grid-template-columns: subgrid;
        /* The hairline is the row's last pixel: 34 in all. */
        grid-template-rows: calc(var(--list-row) - 1px);
        border-bottom: 1px solid var(--ring);
        /* Clear of the sticky head when the keys scroll a row into view. */
        scroll-margin-top: var(--list-row);
        /* What the actions float over. */
        position: relative;
        /* A Shift-click selects flows, not the text between them. */
        user-select: none;
      }
      .library-list :is([data-name-text], [data-status]) { user-select: text; }
      /* Under the top bar, held while the list scrolls; opaque, so a row
         never shows through it. */
      .library-list > [data-list-head] {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--shell);
        color: var(--ink-faint);
        font-size: 12px;
        font-weight: 500;
      }
      /* While flows are ticked the selection bar holds the top (from its
         own 12px, `.selection-bar`), and the head stands beneath it;
         `--selection-bar` is the bar's height, measured by view.ts. */
      [data-selecting] .library-list > [data-list-head] {
        top: calc(12px + var(--selection-bar, 0px));
      }
      [data-selecting] .library-list > [role="row"] {
        scroll-margin-top: calc(12px + var(--selection-bar, 0px) + var(--list-row));
      }
      .library-list [data-list-head] [data-sort] {
        padding: 0;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }
      /* Hover lifts a heading a step, short of the sorted one's ink, so a
         pointer over it never reads as a sort (DEM-32). */
      .library-list [data-list-head] [data-sort]:hover { color: var(--ink-muted); }
      .library-list [data-list-head] [aria-sort],
      .library-list [data-list-head] [aria-sort] [data-sort] { color: var(--ink); }
      .library-list [data-list-head] [data-sort] svg { width: 12px; height: 12px; }
      .library-list [data-list-head] [aria-sort="ascending"] [data-sort] svg {
        transform: rotate(180deg);
      }
      .library-list :is([role="gridcell"], [role="columnheader"]) {
        min-width: 0;
        line-height: calc(var(--list-row) - 1px);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .library-list [role="gridcell"]:focus-visible { outline-offset: -2px; }
      .library-list :is([data-col="videos"], [data-col="length"], [data-col="size"]) {
        text-align: right;
      }
      .library-list :is([data-col="select"], [data-col="open"], [data-col="name"], [data-col="actions"]) {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .library-list [data-col="select"] { justify-content: center; }
      /* The actions hold no track: they float over the row's end, so the
         width they held goes to Name and Where, and nothing moves when
         they show. Still a cell, last in the row's keys. The empty ones
         (the head's, a heading's) keep a box for the keyboard's outline. */
      :is(.library-list, .unreadable-list) [data-col="actions"] {
        position: absolute;
        top: 0;
        right: 0;
        height: calc(var(--list-row) - 1px);
        min-width: 28px;
        justify-content: flex-end;
        /* A focused button's ring stands 2px outside it, past the row's
           end; the cells' clipping would cut it. */
        overflow: visible;
      }
      /* While flows are ticked, the flow and video rows' actions step aside
         as the cards' do, by visibility: they keep their cell, so nothing
         moves (list spec §2.1, §4.2), and the pointer's reveal below is
         opacity only, so it cannot bring them back. */
      [data-selecting] .library-list :is([data-flow], [data-video-row]) > [data-col="actions"] {
        visibility: hidden;
      }
      /* The name keeps its width while a tag beside it is clipped, and
         only a name wider than the cell is cut, at the cell's edge. */
      .library-list [data-name-text] {
        flex: none;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* But a name as wide as its cell leaves its tag the glyph: a worded
         tag's padding and icon, the glyph-only tag's square, and the gap
         (DEM-34). */
      .library-list [data-col="name"]:has(> .row-tags) > [data-name-text] {
        max-width: calc(100% - 20px - 8px);
      }
      /* Beside a search's why, the name is what gives way. */
      .library-list [data-col="name"]:has(> .match-why) > [data-name-text] {
        flex: 0 1 auto;
        min-width: 0;
      }
      .library-list [data-video-row] [data-col="name"] { padding-left: 16px; }
      .library-list .row-tags {
        position: static;
        flex: 0 1 auto;
        flex-wrap: nowrap;
        min-width: 0;
        overflow: hidden;
      }
      /* A date heading is a section label, as the cards' are, not a row:
         from the list's left edge, its chevron, label and count, then a
         rule to the end; room above it and no hairline under it. Its cells
         stay in their columns for the keys; the label's cell spans them. */
      .library-list > [data-heading] {
        padding-top: 14px;
        border-bottom-color: transparent;
        color: var(--ink-faint);
      }
      /* Placed, every one: the label's cell spans the row, so a cell left
         to auto-placement would find no room on it. Videos, Length and
         Size keep their tracks while drawn; Recorded is always the last. */
      .library-list > [data-heading] > [role="gridcell"] { grid-row: 1; }
      /* Positioned, so the box is over the label's cell that spans it, and
         still under the sticky head (z 1) as rows scroll. */
      .library-list > [data-heading] > [data-col="select"] {
        grid-column: 1;
        position: relative;
      }
      .library-list > [data-heading] > [data-col="open"] { grid-column: 2; }
      .library-list > [data-heading] > [data-col="name"] {
        grid-column: 1 / -1;
        /* Past the box and the chevron. */
        padding-left: calc(28px + 20px + var(--gap));
      }
      .library-list > [data-heading] > [data-col="where"] { grid-column: 4; }
      .library-list > [data-heading] > [data-col="videos"] { grid-column: 5; }
      .library-list > [data-heading] > [data-col="length"] { grid-column: 6; }
      .library-list > [data-heading] > [data-col="size"] { grid-column: 7; }
      .library-list > [data-heading] > [data-col="recorded"] { grid-column: -2; }
      .library-list > [data-heading] > [data-col="name"]::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--ring);
      }
      .library-list > [data-heading] .chev {
        width: 12px;
        height: 12px;
      }
      /* The UI sans: the studio's card count is mono. */
      .library-list > [data-heading] :is([data-name-text], .section-count) {
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
      }
      .library-list > [data-heading] .section-count {
        font-weight: 500;
        color: var(--ink-4, var(--ink-faint));
      }
      /* "Couldn't read" under the list: the date headings' label, with no
         chevron (it does not fold) — their room above, their line, their
         sans. The Studio's sheet gives the cards' headings it too (DEM-30). */
      .library-list ~ [data-unreadable] { margin-top: 0; }
      .library-list ~ [data-unreadable] > .section-head {
        /* A date heading row: 14px above a 34px line. */
        height: 48px;
        padding: 14px 0 1px;
        gap: 8px;
      }
      .library-list ~ [data-unreadable] > .section-head :is(h2, .section-count) {
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        line-height: normal;
        letter-spacing: normal;
        text-transform: none;
        color: var(--ink-faint);
      }
      .library-list ~ [data-unreadable] > .section-head .section-count {
        font-weight: 500;
        color: var(--ink-4, var(--ink-faint));
      }
      /* The video's exports as small labels; a file gone is struck. */
      .library-list .version-exports {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 100%;
        margin: 0;
      }
      .library-list .version-exports .export-name { display: none; }
      .library-list .version-exports .export-type {
        padding: 1px 6px;
        border-radius: var(--radius);
        background: var(--control);
        font-size: 11px;
        line-height: 1.4;
      }
      .library-list .version-exports [data-gone] .export-type {
        text-decoration: line-through;
      }
      /* The row's line: under its cells, from the name column on. */
      .library-list > [role="row"] > [data-status] {
        grid-column: 3 / -1;
        display: grid;
        gap: 4px;
        padding-bottom: 8px;
        white-space: normal;
      }
      .library-list [data-status] > p { margin: 0; }
      .library-list .row-rerun { font-size: 12px; color: var(--ink-muted); }
      /* Video rows on a raised ground; hover and keyboard focus share one
         background, and the keyboard's row adds its inset edge. */
      .library-list > [data-video-row] { background: var(--control); }
      .library-list > [data-key]:not([data-heading]):is(:hover, :focus-visible, :has(:focus-visible)) {
        background: var(--control-hover);
      }
      .library-list > [data-key]:focus-visible {
        outline: none;
        box-shadow: inset 2px 0 0 var(--focus);
      }
      /* The actions keep their cell at rest and only fade, so nothing
         moves and the keys still reach them; the selecting rule's
         `visibility` above outranks this. Over the row's end they cover
         the value under them on the hovered row's own ground (the hover
         over the page's), faded in from clear across the gap before
         Recorded, so the date is hidden whole, never half; unseen, they
         let the pointer through to that value. */
      .library-list [data-col="actions"],
      .library-list .row-actions {
        pointer-events: none;
      }
      .library-list .row-actions {
        opacity: 0;
        height: 100%;
        min-width: calc(var(--recorded) + var(--gap));
        justify-content: flex-end;
        padding-left: var(--gap);
        background:
          linear-gradient(90deg, transparent, var(--control-hover) var(--gap)),
          linear-gradient(90deg, transparent, var(--shell) var(--gap));
      }
      .library-list > [data-key]:is(:hover, :focus-visible, :has(:focus-visible)) .row-actions {
        opacity: 1;
        pointer-events: auto;
      }
      /* The keys on Recorded itself: the cover would hide the cell and
         its ring, so neither shows. */
      .library-list > [data-key]:has(> [data-col="recorded"]:focus-visible) .row-actions {
        opacity: 0;
        pointer-events: none;
      }
      /* Where nothing hovers (a touchscreen) they would show always, and
         over Recorded they covered the date (2026-11-03): there they fold
         into a menu behind a ⋯ (list.ts `rowMenu`), which takes the end of
         a Recorded track grown by its width. */
      .library-list .row-more { display: none; }
      @media (hover: none) {
        .library-list .row-actions { display: none; }
        .library-list .row-more {
          display: inline-flex;
          pointer-events: auto;
        }
        :is(.library-list, .unreadable-list) { --recorded: calc(9em + 32px); }
        .library-list > [role="row"] > [data-col="recorded"] { padding-right: 32px; }
      }
      /* Under its ⋯, the end aligned, or above it when the screen ends. */
      .row-menu {
        inset: auto;
        margin: 4px 0;
        position-area: bottom span-left;
        position-try-fallbacks: flip-block;
        min-width: 176px;
        padding: 4px;
        border: 0;
        border-radius: 10px;
        background: var(--shell);
        color: var(--ink);
        box-shadow: 0 0 0 1px var(--line-2), 0 12px 32px rgb(0 0 0 / 0.5);
        line-height: normal;
        pointer-events: auto;
      }
      .row-menu > button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 14px;
        text-align: left;
      }
      .row-menu > button:is(:hover, :active, :focus-visible) { background: var(--control-hover); }
      .row-menu > button.btn-danger { color: var(--error); }
      .row-menu > button:is(:disabled, [aria-disabled="true"]) { color: var(--ink-faint); }
      .row-menu svg { width: 16px; height: 16px; flex: none; }
      /* A finger's row (2026-11-03): 44px, the least a tap target should
         be, where the pointer is coarse; a mouse keeps the dense 34. */
      @media (pointer: coarse) {
        :is(.library-list, .unreadable-list) { --list-row: 44px; }
      }
      .library-list > [aria-expanded="true"] .chev { transform: rotate(90deg); }
      /* An opening flow's videos fade in; no height animation. */
      .library-list > [data-video-row] { transition: opacity 120ms ease; }
      @starting-style {
        .library-list > [data-video-row][data-opening] { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .library-list > [data-video-row],
        .library-list [data-col="open"] .chev,
        .library-list .row-actions { transition: none; }
      }
      /* Under a 760px list the box holds no track and the gaps narrow, so
         the chevron starts at the list's left edge (the tab row's) and the
         name follows it closely: 96px of a 560px list was all box, chevron
         and gaps, and the rows read shifted right of the tab row. The box
         hangs in the margin left of the chevron, the width its track had,
         and shows by the same rules; the placements below are the wide
         ones a track to the left. */
      @container library (max-width: 759px) {
        :is(.library-list, .unreadable-list) {
          --gap: 12px;
          grid-template-columns:
            20px minmax(140px, 3fr) minmax(0, 2fr)
            56px 64px var(--recorded);
        }
        .library-list > [role="row"] > [data-col="select"] {
          position: absolute;
          top: 0;
          right: 100%;
          width: 28px;
          height: calc(var(--list-row) - 1px);
        }
        /* The sticky head and the selection bar stand over the rows as
           they scroll, so they cover the margin the boxes hang in too, or a
           column of boxes slides past them: the bar from 12px above it,
           its sticky top. */
        .library-list > [data-list-head] > [data-col="select"] {
          height: var(--list-row);
          background: var(--shell);
        }
        .selection-bar::before {
          content: "";
          position: absolute;
          top: -12px;
          bottom: 0;
          right: 100%;
          width: 28px;
          background: var(--shell);
        }
        .library-list > [data-heading] > [data-col="open"] { grid-column: 1; }
        .library-list > [data-heading] > [data-col="name"] {
          padding-left: calc(20px + var(--gap));
        }
        .library-list > [data-heading] > [data-col="where"] { grid-column: 3; }
        .library-list > [data-heading] > [data-col="videos"] { grid-column: 4; }
        .library-list > [data-heading] > [data-col="length"] { grid-column: 5; }
        .library-list > [role="row"] > [data-status] { grid-column: 2 / -1; }
        :is(.library-list, .unreadable-list) [data-col="size"] { display: none; }
      }
      /* Where the name column narrows, the why takes Where's place, as on
         a card, and runs on to Recorded over Videos and Length, as the
         unreadable rows' reason does: in the name cell it was cut to "st…". */
      @container library (max-width: 759px) {
        .library-list [data-col="name"] > .match-why,
        .library-list [data-col="where"] > [data-where-text]:has(+ .match-why) {
          display: none;
        }
        .library-list [data-col="where"] > .match-why { display: inline; }
        .library-list > [role="row"]:has(> [data-col="where"] > .match-why) > [data-col="where"] {
          grid-column: 3 / -2;
        }
        .library-list
          > [role="row"]:has(> [data-col="where"] > .match-why)
          > :is([data-col="videos"], [data-col="length"]) {
          display: none;
        }
      }
      @container library (max-width: 639px) {
        :is(.library-list, .unreadable-list) {
          grid-template-columns:
            20px minmax(120px, 3fr) minmax(0, 2fr)
            56px var(--recorded);
        }
        .library-list [data-col="length"] { display: none; }
      }
      @container library (max-width: 559px) {
        :is(.library-list, .unreadable-list) {
          grid-template-columns:
            20px minmax(120px, 3fr) minmax(0, 2fr)
            var(--recorded);
        }
        .library-list [data-col="videos"] { display: none; }
      }
      /* A phone's list (under 480, the tab row's cut too) drops Where: at
         31px it read "/or…". The name takes its room, and a search's why
         goes back beside the name, as wide. A video's export labels, in
         its Where, go with it. */
      @container library (max-width: 479px) {
        .library-list {
          grid-template-columns: 20px minmax(0, 1fr) var(--recorded);
        }
        .library-list [data-col="where"] { display: none; }
        .library-list [data-col="name"] > .match-why { display: inline; }
      }
      /* "Couldn't read" in the list layout, drawn in its own place (no flow
         rows and no column heads above it): the list's column template, so
         the name, reason and size sit where a flow's Name, Where and Size
         would. Delete floats over the row's end, as a flow's actions do,
         and shows at rest: it is all these rows do. */
      .unreadable-list > .unreadable-row {
        position: relative;
        display: grid;
        grid-column: 1 / -1;
        grid-template-columns: subgrid;
        grid-template-rows: calc(var(--list-row) - 1px);
        align-items: center;
        border-bottom: 1px solid var(--ring);
      }
      .unreadable-list > .unreadable-row > [data-col] {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .unreadable-list > .unreadable-row > [data-col="name"] { grid-column: 3; }
      .unreadable-list > .unreadable-row > [data-col="where"] {
        grid-column: 4 / -3;
        color: var(--ink-muted);
      }
      .unreadable-list > .unreadable-row > [data-col="size"] { grid-column: -3; text-align: right; }
      .unreadable-list > .unreadable-row > [data-col="actions"] {
        display: flex;
        align-items: center;
      }
      .unreadable-list > .unreadable-row > [data-status] {
        grid-column: 3 / -1;
        padding-bottom: 8px;
        white-space: normal;
      }
      .unreadable-list > .unreadable-row > [data-status] > p { margin: 0; }
      /* Under a 760px list, the same a track to the left (above), after
         the rules it overrides; the reason runs on to Recorded, the size it
         stood beside gone. */
      @container library (max-width: 759px) {
        .unreadable-list > .unreadable-row > [data-col="name"] { grid-column: 2; }
        .unreadable-list > .unreadable-row > [data-col="where"] { grid-column: 3 / -2; }
        .unreadable-list > .unreadable-row > [data-status] { grid-column: 2 / -1; }
      }

      /* Last: every `display` above loses to `hidden` (shell.css's note on
         `.hidden`). */
      .library-list [hidden],
      .library-list > [role="row"] > [data-status][hidden],
      .layout-toggle[hidden],
      .search-field[hidden],
      .tabs-row[hidden],
      .place-tabs[hidden] { display: none; }

      /* The empty states: the shell's `.empty`, on a card, as on Settings. */
      .empty-card {
        margin-top: 28px;
        padding: 20px 24px;
      }
      .empty .btn-link {
        display: inline;
        padding: 0;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      /* Repeated from the shell, on purpose: rules above set `display` at
         the same specificity, and this file loads after the shell, so the
         shell's own `.hidden` would lose to them. */
      .hidden { display: none; }
    </style>
  </head>
