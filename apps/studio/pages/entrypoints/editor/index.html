<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Editor - Demoman</title>
    <!-- The shell — tokens, faces, the brand lockup, buttons, notices — is
         shared with the popup, the Recordings page and Settings. Only the
         editor's own rules are inline below. -->
    <link rel="stylesheet" href="../../assets/shell.css" />
    <style>
      /* The editor's own tokens, and only those.
       *
       * The ground, the card, the ink, the ring, the controls, the lime
       * primary, the warn and error tints and the faces all come from
       * assets/shell.css — the sheet the popup, Recordings and Settings
       * share — so a change there lands here too. Until 2026-09-14 this
       * file carried a parallel copy of every one of them under its own
       * names (`--panel` for the card, `--hairline` for the ring), which
       * is how the editor came to sit a shade off the pages beside it.
       *
       * What stays inline is what only the editor has: the stage bed and
       * the timeline's beds, the three lane hues, and the floating chrome.
       *
       * The surfaces are DIRECTIONAL: the stage bed is the page's ground
       * (darker than the cards in both themes, since 2026-10-07; before
       * that it was a well painted into a `--shell` page), and the header
       * cards, the rail, the panel and the timeline are the shell's CARD
       * floating on it. Everything here used to be one neutral
       * rgba(127,127,127,.1x) on the theory that a neutral grey needs no
       * theme; at .1 it was ~4% contrast on a dark page, and with the same
       * grey on both sides of the gutter the video and the lanes read as
       * one slab. A card against the bed draws the boundary the gutter
       * alone could not.
       *
       * The lane colours are the second system: each lane's clips wear
       * one hue, and the lane's label carries a dot of the same hue so
       * the legend is the lane itself. Clip is the brand lime the shell's
       * primary is built on; Zoom is the camera's violet; Mask is a coral
       * that reads as "redacted" at a glance. `--lane-*-ink` is chosen
       * per fill: white on the deep fills, near-black on the bright ones.
       *
       * Test-visible contract: editor-shell.test.ts asserts the shell's
       * tokens are NOT re-declared here, editor-shell-layout.test.ts
       * composites these over the shell's, and test/node/theme-tokens.test.ts
       * holds the two dark blocks below identical. */
      :root {
        /* The floating chrome (spec 2026-10-06): cards that float over the
           stage bed take a corner above the shell's 6/8 scale, the overlay
           shadow, and a hairline. `--float` resolves `--ring` and
           `--shadow-overlay` here on :root, where the theme has set them. */
        --radius-float: 12px;
        --float: 0 0 0 1px var(--ring), var(--shadow-overlay);
        /* The rail's own track, the second grid column: the rail card's
           width, before the seam its track carries on the left. */
        --rail-w: 48px;
        --gap: 16px;
        /* The gutter between the shell's cards, and the shell's own inset.
           A different measurement from `--gap`, which is padding INSIDE a
           surface — collapsing the two would make one of them wrong. 16px
           since 2026-10-07 (8px before): the cards float on the stage bed,
           and they read as floating only with the ground showing between
           them. Tune this by eye; no test pins its value, and both stacking
           floors in the media queries below are computed from it BY HAND,
           because a media query cannot read a custom property. */
        --seam: 16px;
        /* The panel column, named once. `--rail-w` sits beside it: the rail
           floated on the picture from 2026-09-21 and took its track back on
           2026-10-07. */
        --panel-w: 320px;
        /* How long the panel takes to open or close. Read by the column
           transition AND by the delay that hides the panel afterwards, so
           the two cannot drift apart and leave the contents painted over a
           stage that has already taken the width. */
        --panel-ms: 180ms;
        /* Every row label in the inspector — a slider's, a switch's, the
           Style heading — and the readout that sits beside one. Held in a
           token because three rules want it and they are not neighbours in
           this sheet; `editor-cursor-panel.test.ts` asserts they agree. */
        --row-label: 14px;
        /* The inspector's vertical rhythm, read off the Cursor panel: 12px
           between one row and the next, and 12px PAINTED between a row's
           label and its control. `inspector-rhythm.test.ts` measures every
           panel against these, so a panel cannot drift from them unseen. */
        --row-gap: 12px;
        /* The page's ground, under every card and under the picture. Flat:
           the radial `--stage-glow` that lit the old well went when the well
           became the whole page (2026-10-07). */
        --stage-bed: #d9dde6;
        /* The ground's dots are the shell's (`--ground-dot`, on every
           page's `body`); the editor only phases them, so a row and a
           column run down the middle of its outer `--seam` inset and the
           cards' outer edges cut the pattern at the same point every time.
           The gutters between cards are fluid and cannot be held to it. */
        --dot-origin: calc(var(--seam) / 2);
        --track: rgba(17, 24, 39, .1);
        /* The playhead is `--ink`: the page's own strongest tone, white on a
           dark dock and near-black on a light one.

           It was `--rec`, the shell's recording red, until 2026-09-21. The
           red was borrowed from a different job — it is what says "this is
           capturing" in the popup and on the Recordings page — and on a dock
           whose lanes now carry four saturated hues it was a fifth one
           competing with them rather than the one line an author tracks. */
        --playhead: var(--ink);
        /* The lane fills. In dark they are deep and desaturated, with white ink
           on every one; in light they are pale tints with a dark ink each
           (since 2026-10-07; the segment's edge in the lane's glyph colour
           keeps them off the bed). They were bright (a neon lime, a violet, a coral) with ink chosen
           per fill until 2026-09-21: bright fills cannot carry white text,
           so each lane needed its own ink and the Clip block's name would
           have been near-black on lime. Deep fills take one ink, which is
           what lets the three lanes read as one system in dark. */
        --lane-clip: #b8d46a;
        --lane-clip-ink: #263006;
        --lane-zoom: #c4b8f2;
        --lane-zoom-ink: #2a1f5c;
        --lane-mask: #f0b4a8;
        --lane-mask-ink: #4a160d;
        /* The pointer tick on the Clip block: a deep olive in light, where
           the block is pale; dark keeps the pale green it always had. */
        --lane-clip-pointer: #46600c;
        /* Each lane's track-head glyph: the lane's hue at full saturation,
           rather than derived from its deep fill. A fill deep enough to carry
           white text reads nearly black as a stroke on the dark dock, and
           lifting it toward white washed it to a pastel; these keep the hue
           and clear 4.5:1 on the glyph's grey disc in each theme.

           All three share one OKLCH lightness and chroma per theme (L 0.50
           C 0.14 here, L 0.76 C 0.136 in dark) and differ only in hue. Picked
           at equal saturation instead, the green read far lighter than the
           violet and the red — 9.3:1 on the disc against 5.4 and 5.8 in dark
           — and Zoom and Mask looked dimmed beside Clip. */
        --lane-clip-glyph: #417300;
        --lane-zoom-glyph: #5c54af;
        --lane-mask-glyph: #a43c2b;
        /* The format chip's dropdown arrow. A data URI's stroke is a
           literal string, not a custom-property read — which is why the
           chevron was a themed token here until 2026-09-21, kept in sync
           with `--secondary-ink` by hand.

           It is inlined at its use site now and it is always white,
           because the chip it sits in stopped theming when the control
           row moved onto the video: see `#stage-bar .chip`'s own comment.
           A token that tracked a theme would be tracking the wrong thing,
           and a hand-kept coupling with nothing left to couple to is a
           maintenance cost with no payer. */
      }
      /* Twice on purpose — under the system query, and under the root's
         data-theme for an author who chose. test/node/theme-tokens.test.ts
         holds the two identical; see assets/shell.css for why. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          /* Black: the page's ground in dark, with the near-black cards
             floating on it. It was the well darker than a `--shell` page
             until 2026-10-07, when the stage bed became the ground. */
          --stage-bed: #000000;
          --track: rgba(255, 255, 255, .07);
          --lane-clip: #44601a;
          --lane-clip-ink: #ffffff;
          --lane-zoom: #433568;
          --lane-zoom-ink: #ffffff;
          --lane-mask: #6b2f2f;
          --lane-mask-ink: #ffffff;
          --lane-clip-glyph: #96c25f;
          --lane-zoom-glyph: #b59fff;
          --lane-mask-glyph: #fb8e7c;
          --lane-clip-pointer: #c5e59a;
        }
      }
      :root[data-theme="dark"] {
        --stage-bed: #000000;
          --track: rgba(255, 255, 255, .07);
        --lane-clip: #44601a;
        --lane-clip-ink: #ffffff;
        --lane-zoom: #433568;
        --lane-zoom-ink: #ffffff;
        --lane-mask: #6b2f2f;
        --lane-mask-ink: #ffffff;
        --lane-clip-glyph: #96c25f;
        --lane-zoom-glyph: #b59fff;
        --lane-mask-glyph: #fb8e7c;
        --lane-clip-pointer: #c5e59a;
      }
      /* Buttons and fields are the shell's: every button the renderers
         build carries `btn btn-quiet` (Play and Render `btn btn-primary`),
         and the field rule is the shell's bare-element one. Nothing is
         restated here, so a change to shell.css reaches the editor. So
         are the sliders (`input[type="range"]`) and their `--slider-rest`
         fill, which Settings' Brand kit draws too. */
      input[type="checkbox"] { accent-color: var(--accent); }
      /* The inspector's panel titles — Export, Background, Cursor, Zoom,
         Mask — in Outfit 16/700, the title weight of the floating cards
         (editor-refresh spec, 2026-10-07). Settings' own `h2` stays 20px
         (`settings-shell.test.ts` holds that side). The review page's
         `article h2` is 16px for its own reasons: those are per-take
         cards. Keyboard shortcuts' title is a panel `h2` like the rest. */
      h2 { margin: 0 0 12px; font: 700 16px/1.2 "Outfit", ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.01em; }
      body {
        margin: 0;
        display: grid;
        /* view · rail · pane. The rail's track and the panel's each carry
           their own seam on the LEFT, and the item inside is held off by an
           equal margin, so the seam belongs to the track rather than to
           `column-gap`. That is what lets the panel's seam leave with the
           panel: a `column-gap` paints its gutter beside a zero-width track
           too, which would strand a seam's width between the rail and the
           window's edge with the panel closed. A margin alone cannot do it
           either —
           a grid item's margin eats into its own track, so a bare
           `margin-left` on a fixed-width track shrinks the item rather than
           offsetting it. (Two tracks from 2026-09-21 to 2026-10-07, while
           the rail floated on the stage; the rail sat in the last track
           for a few hours of 2026-10-07 until the author put it between
           the stage and the panel.) */
        /* The first track is a spacer the width of the rail's, empty
           while the panel is open and filled once it closes, so with the
           panel closed the picture is centred over the timeline instead of
           a rail's width to the left of it (author, 2026-10-07). With the
           panel open the picture sits left of centre, which the author
           accepted. `minmax(0, …)`, so it is the first width to go: grid
           grows a fixed track toward its limit only from space the 520px
           floor has not claimed, so the floors below are unchanged. The
           same track type open and closed, so the column transition
           interpolates rather than jumping. */
        grid-template-columns:
          minmax(0, 0px)
          minmax(520px, 1fr)
          calc(var(--rail-w) + var(--seam))
          calc(var(--panel-w) + var(--seam));
        grid-template-rows: auto auto minmax(220px, 1fr) auto;
        /* Both layouts in one legible place. The stacked order lives in
           the media queries below as a second areas string, which is one
           line each instead of a `grid-column`/`grid-row` reset per child. */
        grid-template-areas:
          "head head head head"
          "note note note note"
          ". view rail pane"
          "dock dock dock dock";
        /* No `row-gap`: the vertical seams ride on the items instead — see
           the rule after the grid placements below. A gap is painted
           between every pair of tracks, empty or not, so the collapsed
           status row put two seams (32px) between the header and the
           middle row. */
        row-gap: 0;
        column-gap: 0;
        padding: var(--seam);
        box-sizing: border-box;
        height: 100vh;
        /* The stage bed is the page's ground (spec 2026-10-06): the picture
           sits on it directly, and every card — the two in the header, the
           rail, the panel, the timeline — floats on it with `--float`. The
           ground was `--shell` until 2026-10-07, with the stage a darker
           well painted into it.

           Dotted since 2026-10-08 — the shell's dots, on `--stage-bed`
           rather than `--shell`, phased by `--dot-origin` above. They
           matter most beside a 9:16 picture, where the ground is half the
           stage. */
        background-color: var(--stage-bed);
        color: var(--ink);
        /* 13px, the shell's body size. Every other page sets its own size
           unlayered; the editor never did, so the injected extension-page
           sheet's 75% (12px) was what it rendered at. */
        font-size: 13px;
        /* The panel's open/close. Animating the TRACK rather than the panel
           means the stage widens into the space as it is vacated, instead
           of the two moving independently. Only the last track moves, so
           the rail slides right with the stage's edge as the panel closes
           and stops at the window's edge. */
        transition: grid-template-columns var(--panel-ms) ease;
      }
      #status { grid-area: note; }
      main { grid-area: view; }
      /* `#inspector`, not a bare `aside`: the shipped page has exactly one,
         but `editor-shell.test.ts` mounts a second `<aside
         data-background-mount>` beside it for the Background panel (see
         its own comment on why that tag), and a bare-tag rule here claimed
         that one too — both then resolved to the identical rect, stacking
         the Background panel exactly on the Export panel instead of
         leaving it in its own implicit row. The other `aside` rules below
         (the card tone, the ring, the padding reset) are deliberately left
         bare: the fixture's second aside is SUPPOSED to pick those up, per
         its own comment, so it reads as a real panel. Only placement is
         the hazard. */
      #inspector { grid-area: pane; }
      #dock { grid-area: dock; }
      /* The vertical seams, carried by the items that need them rather than
         by `row-gap`. The header is held one seam off whatever comes next,
         and the status row adds its own seam below it only while it is
         drawn — `#status` is `display: none` with nothing to say, and a
         box that is not there carries no margin. So the header sits one
         seam above the middle row with the row collapsed, and one seam
         above the status card, one seam above the middle row, when it
         shows. Measured before this: 32px from the header cards to the
         stage, from a gap on each side of an empty track. The stacked
         layouts add the panel's own seam in their media blocks. */
      header { margin-bottom: var(--seam); }
      #status { margin-bottom: var(--seam); }
      #dock { margin-top: var(--seam); }
      /* The seam the panel's track carries, taken back as the item's own
         inset so the painted card is its true width. `#rail` does the same
         in its own rule below: each item's seam is the gap to whatever is
         on its left. */
      aside { margin-left: var(--seam); }
      /* Closed: the panel column collapses here, and the panel itself is
         hidden by `body[data-panel="closed"] aside` far below — a selector
         with a `body` in front of it has to come after the bare `aside` it
         overrides, or the cascade reads as an accident (biome's
         `noDescendingSpecificity`). */
      body[data-panel="closed"] {
        grid-template-columns:
          minmax(0, calc(var(--rail-w) + var(--seam)))
          minmax(520px, 1fr)
          calc(var(--rail-w) + var(--seam))
          0;
      }
      /* A card in its own track since 2026-10-07, between the stage and the
         panel: with the panel open it is the panel's left neighbour, and
         with it closed the rail is the window's right edge, beside the
         stage, which takes the panel's width.

         `--card`, the same tone the panel beside it carries: the rail and
         the panel are two cards of one pair, and editor-shell.test.ts
         asserts they are EQUAL in both themes, so a future pass cannot
         re-segment them quietly. The boundary that matters is card against
         ground, and `--float` adds the shadow that makes it read as
         floating rather than tiled.

         `align-self: start`: the card is as tall as its entries, not the
         row. It floated on the picture from 2026-09-21, with a dark scrim
         on each entry because a frame could be any tone; on a card of its
         own the entries are quiet controls again. */
      #rail {
        grid-area: rail;
        align-self: start;
        margin-left: var(--seam);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 6px;
        background: var(--card);
        border-radius: var(--radius-float);
        box-shadow: var(--float);
      }
      /* Delete, red under the pointer — the same answer the Recordings
         page's own delete gives, and from the same two tokens.

         The shell already says this, in `.btn-icon.btn-danger:hover`, and
         `#delete` has carried `btn-danger` all along. This sheet is
         UNLAYERED (shell.css sits in `@layer shell`), and an unlayered
         declaration beats a layered one whatever their specificities, so
         `.head-card .btn-icon:not(:disabled):hover` below would paint the
         grey pill over the shell's red if this were left to the shell.
         Restated here, in the same layer, where it is settled by
         specificity: (0,4,1) against the (0,4,0) of that grey hover.
         `editor-shell.test.ts` hovers the real button and reads the
         painted result, because the winning rule is a question about
         layers and the only answer that counts is what the pixel does. */
      header .head-card .btn-danger:not(:disabled):hover {
        background: var(--error-soft);
        color: var(--error);
      }
      /* The notes button wears the worst of what `#notes` holds, at rest
         rather than under the pointer: it is the only sign on the page
         that a card is waiting, so it cannot wait for a hover to say so.
         Same tokens as Delete's hover for an error; the shell's warn pair
         for a note. A plain report rests like the card's other icons —
         transparent, muted ink — and takes their grey under the pointer.

         The two levels are restated for hover, for the reason Delete's is
         above: the card's quiet hover, `.head-card .btn-icon:not(:disabled)
         :hover` (0,4,0), out-ranks the level rules (0,3,1) and painted a
         red or amber button grey the moment the pointer reached it. The
         hover forms are (0,5,1). */
      header .actions .btn-notes { position: relative; anchor-name: --notes; }
      header .actions .btn-notes[data-level="error"],
      header .head-card .btn-notes[data-level="error"]:not(:disabled):hover {
        background: var(--error-soft);
        color: var(--error);
      }
      header .actions .btn-notes[data-level="warn"],
      header .head-card .btn-notes[data-level="warn"]:not(:disabled):hover {
        background: var(--warn-soft);
        color: var(--warn);
      }
      header .actions .btn-notes [data-count] {
        position: absolute;
        top: -2px;
        right: -2px;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        box-sizing: border-box;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        line-height: 18px;
        text-align: center;
        background: var(--ink);
        color: var(--shell);
      }
      header .actions .btn-notes[data-level="error"] [data-count] { background: var(--error); }
      header .actions .btn-notes[data-level="warn"] [data-count] { background: var(--warn); }
      /* Quiet icons on the card, like the header's: no fill until the
         pointer arrives. Set here, not left to the shell: the shell's `.btn`
         declares no background of its own (every other icon button pairs
         it with `.btn-quiet`), so an entry with nothing set paints Chrome's
         own `buttonface` — found by editor-shell.test.ts's rail assertion
         on 2026-09-14.

         The open panel's entry is pressed: a `--control-hover` step off
         the card, a step past the hover's `--control`, under the accent
         ink. `--accent-soft` was the first choice for the fill and was
         measured out — #f7fde7 on a #fff card is 1.04:1 in light, under
         the 1.1:1 every quiet control has to clear against what it sits
         on. The `var(--accent)` ink is right here and was wrong while the
         rail sat on footage, where its light-theme olive vanished on a
         bright frame and a fixed lime stood in for it.
         `editor-shell-layout.test.ts`'s "spends the brand colour on ...
         controls and no others" counts this entry among the controls that
         carry the brand colour. */
      #rail .btn { width: 36px; height: 36px; padding: 0; background: transparent; color: var(--ink-muted); }
      /* Not the pressed entry: this selector outweighs the pressed rule
         below by a pseudo-class, so without the exclusion the open entry
         lost its fill and its accent the moment the pointer reached it. */
      #rail .btn:not(:disabled):not([aria-pressed="true"]):hover { background: var(--control); color: var(--ink); }
      #rail .btn[aria-pressed="true"] { background: var(--control-hover); color: var(--accent); }
      #rail .btn:disabled { opacity: 0.38; }
      :where(#rail .btn) svg { width: 18px; height: 18px; }
      /* The panel column. It carried a `border-left` until 2026-09-20,
         which the stacking media query below had to move to `border-top` —
         a bare-`aside` override at equal specificity, so the two rules'
         ORDER in this sheet decided which won, and for a while the wrong
         one did. Without a line there is no line to move and no order to
         get wrong: the panel is a card floating on the ground, like the
         rail beside it, in both layouts. */
      aside {
        background: var(--card);
        border-radius: var(--radius-float);
        box-shadow: var(--float);
        overflow-y: auto;
        /* No padding of its own: it moved onto `.inspector` below. A
           border-box grid item keeps its padding inside a 0px track and
           renders a 32px sliver past the window's edge; with the padding
           one level in, the panel's border box IS the track. */
        padding: 0;
        /* The panel's right edge is the shell's — the window's, less the
           seam it is inset by — and its LEFT edge is what sweeps inward as
           the column closes. Anchoring the contents to the
           right, at a fixed width, is what keeps them still while that edge
           passes over them — left-anchored they would slide right with the
           box, and auto-width they would reflow the whole way. */
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        /* `visibility`, not `display`, is what the closed state uses — see
           the rule far below — and it is listed here so the OPEN direction
           reveals the panel immediately rather than at the end. */
        transition: visibility 0s;
      }
      /* Fixed at the open width so nothing inside re-wraps while the column
         moves: the panel is clipped, not re-laid-out. `aside` is a scroll
         container, so what overflows its left edge is cut off rather than
         painted over the stage. */
      .inspector {
        flex: 0 0 var(--panel-w);
        padding: var(--gap);
        /* What the close button is placed against. */
        position: relative;
      }
      /* Top right, level with the panel's 16px title, and the title is held
         clear of it so a long one wraps before running under it. Scrolls
         with the panel, as a dialog's close does. */
      .inspector-close {
        position: absolute;
        top: calc(var(--gap) - 7px);
        right: calc(var(--gap) - 7px);
        width: 28px;
        height: 28px;
        color: var(--ink-muted);
        background: transparent;
      }
      .inspector-close:hover { color: var(--ink); }
      .inspector > h2, .inspector > * > h2:first-child { padding-right: 28px; }
      /* The status row: cards side by side, not blocks stacked full-width,
         so the stage is not pushed down by a band the height of every
         message at once. Wraps when there are more than fit.

         No padding of its own. A status entry paints `--card` and
         `--radius-card` — it IS a card, same as `#dock`, `#inspector` and
         `#rail` — so it lines up with the shell's outer edges: its left
         edge is `main`'s, its right edge is the last card's — the panel's
         while it is open, the rail's once it closes. `#status`'s own box
         already spans that width (it is the `note` grid area, over all
         three columns `main`, `#rail` and `aside` sit in), so a padding
         of `--gap` here did nothing but inset the card FROM that box,
         16px on both sides — measured, a banner at x=24..715 against
         `main` at 8..1048. Zero padding lets the card's edges be the
         box's edges; the vertical seams above and below it are margins,
         set with the grid placements above. */
      #status { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px; padding: 0; }
      #status > * { flex: 1 1 320px; min-width: 0; }
      /* An empty panel must not hold part of the row open beside the one
         with something to say. */
      #status > :empty { display: none; }
      /* `:empty` never matched: #status always holds its panel div, so it
         has element children whether or not any of them has anything to
         say. `:has` asks the question that was meant — is there a panel in
         here with content, and is it one that is not hidden. Only
         `#develop` lived here from 2026-09-22 (the rest moved to `#notes`),
         and it left with the rebuild on 2026-09-28 (plan 2 of the agent
         door, Task 7) — the run page carries its own copy. The row has no
         resident now and so stays collapsed. */
      #status:not(:has(> :not(:empty):not(.hidden))) { display: none; }
      /* The notes popover, hung under its button by anchor positioning and
         right-aligned to it. In the top layer, so opening it moves nothing
         on the page — which is the point of it. On the ground colour with
         the overlay shadow, so the cards inside keep their own `--card`
         and read as the same cards they were in the row.

         `display` only while open: the UA hides a closed popover with a
         `display: none` this sheet would otherwise override. */
      #notes {
        position-anchor: --notes;
        position-area: bottom span-left;
        inset: auto;
        margin: 8px 0 0;
        width: min(440px, calc(100vw - 32px));
        max-height: min(70vh, 560px);
        overflow: auto;
        box-sizing: border-box;
        padding: 10px;
        border: 0;
        border-radius: var(--radius-card);
        background: var(--shell);
        color: var(--ink);
        box-shadow: var(--shadow-overlay);
      }
      #notes:popover-open { display: flex; flex-direction: column; gap: 10px; }
      #notes > :empty { display: none; }
      /* `minmax(0, 1fr)`, not `1fr`, in `#stage` below — and `min-height: 0`
       * on every box between it and the grid row that sizes it.
       *
       * A bare `1fr` row takes its automatic minimum from its content, and
       * the content here is a canvas: `render()` assigns it a bitmap the size
       * of the output, which is also its intrinsic size and aspect ratio for
       * layout. `height: 100%` cannot resolve against a row that is itself
       * sized by its content, so the canvas fell back to its aspect ratio and
       * took `width / (1280/720)` — a height derived from the width alone,
       * which ignores how much vertical room the window actually has.
       *
       * Below about 900px of window height that made the canvas taller than
       * the stage, and since a canvas overflows visibly it painted straight
       * down across the timeline: 111px of overlap at 1440x900, 449px once
       * the stage's own box had collapsed to nothing. `#stage`'s rect kept
       * reporting a clean gap the whole time, because the box was never what
       * was on screen.
       *
       * `minmax(0, 1fr)` floors the row at 0 instead of at its content, which
       * makes the row's height definite; `height: 100%` then resolves against
       * it and `object-fit: contain` letterboxes the bitmap inside.
       *
       * The 220px floor that pairs with it is on the BODY's `view` row since
       * 2026-09-21, because the timeline left `main` for `#dock`: flooring
       * the row at 0 alone fixed the overlap by letting the video shrink to
       * nothing — at 1200x420 the canvas was 0px tall — and a demo editor
       * whose video has vanished is not better than one whose video is in
       * the wrong place. */
      /* NOT a card, since 2026-09-21. It was `--card` with `--gap` of
         padding and `#stage` inset inside it, which put two surfaces under
         the picture: the letterbox bars read as bars INSIDE a box rather
         than as the background the frame sits on. The reference mockup's
         preview panel IS its gradient, with the frame floating directly on
         it, and that is the pattern the author asked for.

         So this is the grid area and nothing else; `#stage` carries the
         clipping and fills it edge to edge, and since 2026-10-07 neither
         paints — the frame floats on the page's own ground. The picture
         gains the 32px of vertical padding that used to be here, which is
         headroom the 150px floor keeps rather than spends. */
      main { min-height: 0; display: grid; }
      /* The picture's region. It was THE WELL — a `--stage-bed` box with a
         radial glow — from 2026-09-21 to 2026-10-07, and before that the
         tone was on `#preview`, which made the canvas element's box the
         well and the letterboxing the canvas's own background. The bed is
         the page's ground now, so this box paints nothing and the
         letterboxing is simply the ground showing beside the frame.

         `--frame-ratio` and `--frame-px` default to the target `main.ts`
         starts on (`previewTarget(LANDSCAPE_1080P)` = 1280x720), so the
         page before its first `retarget` is not guessing — it is showing
         the target it actually has. */
      #stage {
        --frame-ratio: 16 / 9;
        --frame-px: 1280;
        --frame-w: min(100cqw, calc(100cqh * var(--frame-ratio)));
        min-height: 0;
        display: grid;
        /* ONE row since 2026-09-21. `#stage-bar` used to be a second,
           `auto` row, which took its height straight out of the picture's
           — the full-screen button had to be shrunk to 22px to keep
           `#preview` above its 150px floor. The controls float over the
           frame now, the way a player's do, so the video gets that height
           back and the row costs nothing. `position: relative` is what the
           floating row is positioned against. */
        grid-template-rows: minmax(0, 1fr);
        position: relative;
        /* No background, no radius: the stage paints nothing since
           2026-10-07. The picture sits on the page's ground — the stage bed
           `body` paints — with no well of its own around it. */
        overflow: hidden;
      }
      /* Fit is the default and is already in `#stage`'s own `--frame-w`.
         "100%" here means one PREVIEW-BITMAP pixel per CSS pixel, not one
         deliverable pixel — `--frame-px` is `previewTarget`'s own
         downscaled width (1280 for a 1920px landscape output, so this is
         67% of the real deliverable, not 1:1 with it). Reads `--frame-px`
         rather than any measurement of the stage. Whether the chip should
         instead read as "output resolution" (Premiere/Resolve's meaning of
         100%) is an open design question, not settled by this rule. */
      body[data-zoom="actual"] #stage { --frame-w: calc(var(--frame-px) * 1px); }
      /* `container-type: size` is what makes `100cqw`/`100cqh` resolve
         against this box, and it can do that because the row above is
         `minmax(0, 1fr)` — a definite size in the WIDE layout, where
         `body` is `height: 100vh`. `overflow: auto` is NOT inert: at
         `body[data-zoom="actual"]`, `#stage-frame` is deliberately larger
         than this box in both axes (see the rule below), and `overflow:
         auto` together with `place-content: safe center` is exactly what
         makes the frame's top-left corner reachable by scrolling —
         `safe` falls back to start alignment on overflow, so the
         author's scroll can reach an edge that `center` alone would push
         to a negative, unreachable offset. `editor-preview-zoom.test.ts`'s
         "lets the author reach the frame's top-left corner" test exists to
         catch either property going missing.

         `min-height: 0`, not a floor: in THIS (wide) shape `#stage`'s row
         is already definite, so `#stage-box` needs nothing of its own to
         stay open, and giving it one is actively wrong here — see the note
         above `aspect-ratio: var(--frame-ratio)` in both stacked `@media`
         blocks below for why the fix belongs there instead, and why it
         must NOT be duplicated onto this base rule: an `aspect-ratio` on
         `#stage-box` here would fight the definite row it already has and
         break the very letterboxing this task exists to preserve. Two
         floor-shaped fixes were tried and reverted before this one —
         `calc(220px - 2 * var(--gap))` here, then `minmax(220px, 1fr)` on
         both stacked rows — see `task-1-report.md`'s fix rounds 1 and 2
         for why each pinned the picture to a literal instead of restoring
         its pre-2026-09-21 size. */
      #stage-box {
        container-type: size;
        min-height: 0;
        overflow: auto;
        display: grid;
        place-content: safe center;
      }
      /* `min(100cqw, calc(100cqh * ratio))` IS `object-fit: contain`
         written as a width, which is why fit needs no script. */
      #stage-frame {
        position: relative;
        aspect-ratio: var(--frame-ratio);
        width: var(--frame-w);
        /* The cards' corner, so the picture reads as one of them (author,
           2026-10-07). `#preview` rounds its own pixels below; the frame
           is not `overflow: hidden`, because a mask's grips at the edge
           of the picture would be clipped with it. The deliverable is not
           rounded — this is the editor's view of it. */
        border-radius: var(--radius-float);
        box-shadow: inset 0 0 0 1px var(--ring);
      }
      /* The picture's controls in FULL SCREEN, where the dock that holds
         their toolbar copy (`#stage-tools`) is not painted — see the
         `display` rules right after this block, which hide it everywhere
         else. There it lies ON the picture, not under it — the arrangement
         every player uses. Out of flow, so the video keeps the height a
         row would cost it.

         `pointer-events: none` with `auto` on the controls is the same
         trick `#stage-overlay` already plays, and here it is load-bearing:
         the row lies across the bottom strip of the frame, which is where
         a selected mask's `s`/`sw`/`se` grips are. Without it the whole
         strip would swallow those drags; with it only the chips do, and
         the gap between the clock and them stays draggable. */
      #stage-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        /* The ROW spans the picture exactly; the CONTROLS are inset from
           it. `box-sizing: border-box` above is what lets both be true at
           once — the border box still measures `--bar-w`, so the row keeps
           tracking the frame, and the padding pulls the clock and the
           chips off the video's own edges.

           Flush was wrong and it is worth saying why rather than just
           changing the number: controls hard against a frame's corner read
           as clipped, and the bottom edge is exactly where a letterboxed
           cut's black meets the picture's, so anything sitting on that
           line is ambiguous about which side it belongs to. 12px is
           neither `--gap` nor `--seam` deliberately — those space things on
           the app's surfaces, and this row is on footage. */
        padding: 12px;
        /* Never narrower than its own controls. A 9:16 picture at an
           ordinary window is ~270px wide, under what the clock, the
           three-way shape switch, Fit and full screen need, and capped to
           it the switch shrank inside its `overflow: hidden` until the
           checked 9:16 was cut off (2026-10-06). Wider than the picture,
           the row stays centred on it and spills onto the stage around
           it. */
        min-width: max-content;
        /* On the PICTURE's edges, not the stage's. The mockup caps its
           readout row to the frame's width so the controls line up with the
           video instead of with the panel.

           `--bar-w` is the frame's MEASURED width, published by `main.ts` —
           it cannot be derived here. `--frame-w` is built from `100cqw`/
           `100cqh`, which resolve against `#stage-box`, and this row is
           `#stage-box`'s SIBLING rather than its descendant: the same
           expression used here would fall back to the small viewport and
           produce a width that is wrong everywhere without looking wrong
           anywhere.

           `min(…, 100%)` clamps to the stage, because at 100% zoom the frame
           is deliberately wider than the box it scrolls inside and an
           unclamped row would run off the side. The `100%` fallback is the
           full-width row this replaced, so a measurement that never arrives
           degrades to the previous layout rather than to a broken one. */
        width: min(var(--bar-w, 100%), 100%);
        box-sizing: border-box;
        pointer-events: none;
        /* Absolute against `#stage`, NOT against `#stage-frame`, and the
           difference matters at 100%: inside the frame this row would
           scroll away with the picture and take the zoom chip — the only
           way back to Fit — off screen with it. Anchored here it stays put
           while the picture pans beneath it.
           `--bar-lift` is the gap between the stage's bottom edge and the
           picture's, published by the same observer as `--bar-w` and
           clamped at 0 there, so a letterboxed cut lifts the row onto the
           video while an overflowing one leaves it on the stage's floor. */
        position: absolute;
        bottom: var(--bar-lift, 0px);
        left: 50%;
        transform: translateX(-50%);
      }
      /* Full screen only. Outside it the same controls are in the timeline
         toolbar (`#stage-tools`); inside it `#stage` is all the browser
         paints, so this row is the only way to the clock, the zoom chip,
         and back out. */
      #stage-bar { display: none; }
      #stage:fullscreen #stage-bar,
      #stage[data-fullscreen] #stage-bar { display: flex; }
      #stage-bar > * { pointer-events: auto; }
      /* Tabular AND unwrapped, for the reason the transport's copy carried:
         the clock is ~57px of text and "0:03 / 0:12" broken after the slash
         is a readout that changes shape as it counts. In the UI's own face
         since 2026-10-08, not `--font-mono` — see the toolbar's copy. */
      /* On the video, so the same fixed treatment as the chips beside it —
         see their rule for why this one corner of the sheet does not
         theme. Its own scrim, because a bare white clock vanishes on a
         bright frame. */
      #stage-bar .stage-clock {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        white-space: nowrap;
        padding: 3px 10px;
        border-radius: 999px;
        background-color: rgb(0 0 0 / 0.55);
        backdrop-filter: blur(6px);
        color: #fff;
      }
      #stage-bar .stage-actions { display: flex; align-items: center; gap: 6px; min-width: 0; }
      /* The aspect toggle sits among the stage's chips, so it takes their
         height rather than the panel's roomier segment — and their scrim,
         not the shell's themed segment tones: this row floats on the video,
         where no token pair holds (see `#stage-bar .chip`'s comment below).
         The checked segment is a lighter wash of the same white ink. */
      #stage-bar .segmented {
        border: 0;
        border-radius: 999px;
        background-color: rgb(0 0 0 / 0.55);
        backdrop-filter: blur(6px);
      }
      #stage-bar .segment { padding: 3px 10px; font-size: 12px; background: transparent; color: rgb(255 255 255 / 0.72); }
      #stage-bar .segment + .segment { border-left: 1px solid rgb(255 255 255 / 0.18); }
      #stage-bar .segment[aria-checked="true"] { background: rgb(255 255 255 / 0.22); color: #fff; }
      /* `#failure` (in `#notes`) sits OUTSIDE `#stage`, so while the
         document is full screen — `requestFullscreen` succeeded, or an
         `exitFullscreen` refusal left it standing — only `#stage`'s own
         subtree paints and a message routed there only is invisible for as
         long as the refusal is actually relevant. `position: absolute`
         against `#stage-bar` above: out of flow, so an error showing or
         clearing never changes the row's own height. Anchored ABOVE the
         bar (`bottom: 100%`) so it reads over the picture rather than
         under the chips, where a narrow window would clip it. The
         toolbar's copy of the same banner has its own rule beside
         `#stage-tools`. */
      #stage-bar [data-stage-error] {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 100%;
        margin-bottom: 6px;
        padding: 6px 10px;
        border-radius: var(--radius);
        background: var(--error-soft);
        color: var(--error);
        font-size: 12px;
        /* `#stage` clips (`overflow: hidden`) and this sits inside its
           first row, so an unbounded message could grow past the top edge
           and clip silently — a rejection's own text is not length-bounded.
           A clipped reason is still a reason lost, which is the entire
           point of routing it here, so it scrolls instead. */
        max-height: 4.5em;
        overflow: auto;
      }
      /* Below the shell's own floor the columns stopped fitting and simply
         overflowed: `body.scrollWidth` pinned at the breakpoint and the
         inspector ran off the right edge of the window.

         There are TWO floors, because closing the panel takes a column away,
         and one rule keyed on width alone could only ever know about one of
         them. The rail's and the panel's tracks each carry a seam, and the
         shell itself is inset by one on each side (16px since 2026-10-07):

           panel open:   16 inset + 520 stage + (48 rail + 16 seam)
                         + (320 panel + 16 seam) + 16 inset = 952
           panel closed: 16 inset + 520 stage + (48 rail + 16 seam)
                         + 16 inset = 616

         These two sums are maintained BY HAND: a media query cannot read
         `--seam`, so tuning the seam moves the real floor and leaves the
         literals below behind. `editor-shell-layout.test.ts`'s "the stacking
         floors are the real floors" asserts the relationship rather than
         either number, and is what catches that.

         `max-width` reads inclusively, so the last width that does NOT fit is
         one below each floor: 951 with the panel open, 615 with it closed.
         Keyed on the open floor alone, an 800px window stacked with the
         panel closed even though the closed layout fits in it comfortably
         — and closing the panel, whose whole job is to give the width to
         the stage, did nothing.

         Do not round either number up for comfort, and do not leave one
         standing when the seam moves. A breakpoint ABOVE the real floor
         stacks a layout that fits — the open number said 900px until
         2026-09-14, which stacked a 900px window with 12px to spare and
         pushed the timeline's bottom to y=989 in a 560px one. A breakpoint
         BELOW it leaves a band of widths where the columns overflow instead
         of stacking, which nobody sees unless they resize into it.

         Stacked: the picture with the rail beside it, then the timeline,
         then the panel under it. The rail keeps its own 48px track beside
         `view` rather than taking a row: it costs the picture little and
         stays next to what it acts on, and as a column at every width it
         has no orientation to flip. (It was a row between the dock and the
         panel until 2026-09-21, then floated on the picture until
         2026-10-07.) The header cards wrap onto two lines if they must.
         The `aside` rule is written once per case rather than
         shared: a selector matching both would have to name `body` twice
         anyway, and each copy outranks the bare `aside` rule above it, so
         the cascade no longer depends on which came last in the sheet.

         Both stacked templates' `view` row is a bare `1fr`, same as before
         2026-09-21 — no `minmax(220px, ...)` floor here. A floor was tried
         twice on this branch (on `#stage-box` directly, then here on both
         rows) and reverted both times: below 952px `body` is `height:
         auto`, so a floor is the ONLY thing a `1fr` row can fall back to
         under an indefinite container — it cannot grow to fill the window,
         which is what actually happened (measured: the picture pinned at
         ~188px regardless of window height, against ~484.75px before this
         task at 900x560). The real fix is `#stage-box`'s own
         `aspect-ratio`, below — see the comment beside it. */
      @media (max-width: 951px) {
        body:not([data-panel="closed"]) {
          grid-template-columns: 1fr calc(var(--rail-w) + var(--seam));
          grid-template-rows: auto auto 1fr auto auto;
          grid-template-areas: "head head" "note note" "view rail" "dock dock" "pane pane";
          height: auto;
          min-height: 100vh;
        }
        /* A row of its own under the dock here, so the panel takes its seam
           on top rather than on the left. */
        body:not([data-panel="closed"]) aside { margin-left: 0; margin-top: var(--seam); }
        body:not([data-panel="closed"]) .inspector { flex: 1 1 auto; }
        /* `#stage`'s row is `minmax(0, 1fr)` under `main`'s content-box —
           indefinite here, since `body` is `height: auto` and nothing
           above floors it — so `container-type: size` on `#stage-box`
           (needed everywhere, for the zoom control's `cqw`/`cqh`) cuts it
           off from the one thing that used to give it a height anyway: the
           canvas's own intrinsic aspect ratio, before 2026-09-21. This
           restores exactly that, on the BOX instead of the canvas —
           `aspect-ratio` derives a block size from `#stage-box`'s inline
           size, which IS definite here (the stacked `1fr` column beside the
           rail's fixed track), so the
           picture sizes from its own ratio the same way it always did.
           `#stage-frame`'s own `--frame-w: min(100cqw, calc(100cqh *
           ratio))` is unaffected: with `#stage-box`'s height now DERIVED
           from that same ratio, `100cqh * ratio` and `100cqw` compute to
           the same number, so the `min()` picks either and the frame fills
           the box exactly — no double letterboxing.

           Scoped to this media query ONLY. In the WIDE layout `#stage-box`
           has a definite row already (`body`'s `grid-template-rows`, the
           `minmax(220px, 1fr)` track) and
           must go on letterboxing inside it; an `aspect-ratio` there would
           override that definite height with one derived from width, which
           is the whole bug this task's `#stage-frame` mechanism exists to
           avoid. */
        body:not([data-panel="closed"]) #stage-box {
          aspect-ratio: var(--frame-ratio);
        }
      }
      @media (max-width: 615px) {
        body[data-panel="closed"] {
          grid-template-columns: 1fr calc(var(--rail-w) + var(--seam));
          grid-template-rows: auto auto 1fr auto auto;
          grid-template-areas: "head head" "note note" "view rail" "dock dock" "pane pane";
          height: auto;
          min-height: 100vh;
        }
        body[data-panel="closed"] .inspector { flex: 1 1 auto; }
        /* Same reason as the open template's `#stage-box` rule above — a
           separate rule because this is a separate selector under a
           separate breakpoint, not because the reasoning differs. */
        body[data-panel="closed"] #stage-box {
          aspect-ratio: var(--frame-ratio);
        }
        /* Stacked, the panel is a ROW, and there is no column animating
           shut for `visibility` to wait on. `visibility: hidden` would hold
           a full-height row open with nothing painted in it — `display`
           takes it out of the flow, which is what closing means here.

           The seam reset rides in this rule rather than in one of its own:
           a second `body[data-panel="closed"] aside` inside this block is
           what `editor-shell-layout.test.ts`'s "animates the panel from one
           duration" finds when it looks for the mediated closer, and it
           read an empty `display` off it. */
        body[data-panel="closed"] aside { margin-left: 0; display: none; }
      }
      /* Transparent since 2026-09-21: the picture sits on the ground (a
         well `#stage` painted until 2026-10-07) and this fills
         `#stage-frame`, whose box is already the bitmap's ratio — so
         `object-fit: contain` has nothing left to letterbox and is kept
         only as the floor under a ratio that has momentarily drifted. The
         radius and the ring moved to the frame, where they trace the
         picture instead of the well. */
      #preview {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: contain;
        background: transparent;
        border-radius: var(--radius-float);
      }
      /* `inset: 0` on `#stage-frame`, which IS the drawn box — so
         `renderStageOverlay` places each box against a container that is
         already correct. Sized to `#stage-box` until 2026-09-21, when the
         box it had to describe stopped being computable from the canvas
         alone. */
      #stage-overlay { position: absolute; inset: 0; pointer-events: none; }
      .overlay {
        position: absolute;
        box-sizing: border-box;
        border: 2px solid var(--ink);
        pointer-events: auto;
        cursor: move;
      }
      .overlay[data-overlay="mask"] {
        background: color-mix(in srgb, var(--lane-mask-glyph) 30%, transparent);
      }
      .overlay[data-overlay="zoom"] {
        border-style: dashed;
        border-color: var(--lane-zoom-glyph);
      }
      .grip {
        position: absolute;
        width: 10px;
        height: 10px;
        margin: -5px;
        background: var(--card);
        border: 1px solid var(--ink);
      }
      .grip[data-handle="nw"] { left: 0; top: 0; cursor: nwse-resize; }
      .grip[data-handle="n"] { left: 50%; top: 0; cursor: ns-resize; }
      .grip[data-handle="ne"] { left: 100%; top: 0; cursor: nesw-resize; }
      .grip[data-handle="e"] { left: 100%; top: 50%; cursor: ew-resize; }
      .grip[data-handle="se"] { left: 100%; top: 100%; cursor: nwse-resize; }
      .grip[data-handle="s"] { left: 50%; top: 100%; cursor: ns-resize; }
      .grip[data-handle="sw"] { left: 0; top: 100%; cursor: nesw-resize; }
      .grip[data-handle="w"] { left: 0; top: 50%; cursor: ew-resize; }
      /* The timeline's card. The transport sits above the lanes here since
         2026-09-21; it used to be the second row of `#stage`. A floating
         card since 2026-10-07: `--card` on the stage bed is the boundary,
         and `--float` is what makes it read as lifted off the ground. */
      #dock {
        min-width: 0;
        min-height: 0;
        /* A grid, so the lanes can be given LESS than they want.
           `#dock` sits in an `auto` body row, and an auto row's minimum is
           its content unless something inside can shrink — so as a plain
           block the dock kept its full height in a short window and was
           pushed off the bottom of it, with the shell's own `100vh` box
           reporting nothing wrong. The old layout got this for free: the
           timeline was an `auto` row inside `main` and `overflow-x: auto`
           already made it a scroll container, whose automatic minimum is 0.
           Measured at 1000x620 with a notice showing: the dock's bottom
           landed at 736 in a 620px window. `minmax(0, 1fr)` gives the lanes
           the same floor here, so a cramped window squeezes the lanes —
           which scroll — rather than the video, which cannot. */
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        background: var(--card);
        border-radius: var(--radius-float);
        box-shadow: var(--float);
        /* The transport sits between the card's edge and the divider over
           the ruler, centred (2026-10-08): the play disc had 16px above it
           against 12px below. Its 44px row leaves 4px either side of the
           36px disc; above that is this 8px, below it `#timeline`'s 2px and
           `.lane`'s 6px — 12px each side. */
        padding: 8px 14px 12px;
        box-sizing: border-box;
      }
      /* The padding-and-negative-margin pair moves this scroll container's
         clip edge 11px out into the dock's own 14px padding without moving
         the lanes. At the take's last frame the playhead sits on the axis's
         right edge — its 2px line starting where the track ends, half its
         20px knob past it — and `overflow-x: auto` clips at this box, so
         until 2026-09-22 playing to the end hid the line and cut the knob in
         half. 11px is the knob's reach past the edge; the lanes, the ruler
         and the axis keep the content box they had. */
      #timeline { overflow-x: auto; min-height: 0; padding-right: 11px; margin-right: -11px; padding-top: 2px; }
      /* The label column, named once. Every element on the axis — the ruler,
         the lanes, the playhead's overlay — is inset by exactly this, and a
         second hardcoded copy of it is how the ruler and the playhead came to
         measure a different box from the clips they are drawn over. */
      /* The track headers' column: the widest header (a 26px disc, an 8px
         gap and "Clip"/"Zoom"/"Mask" at 12px) needs about 70px; the Mask
         header also carries the 22px + (8px more gap), which makes it about
         94px, and this leaves that room (84px clipped "Mask" to 20px of
         its 30). It was 108px for part of 2026-09-22, to fit a line of text
         the Clip header no longer carries. */
      .timeline { position: relative; --lane-label: 96px; --lane-gap: 10px; }
      /* `ew-resize`, because the ruler is now a scrub surface and a bare
         arrow over it says "nothing here". */
      /* Flat since 2026-09-21: the tinted bed (`--ruler`, a 3-4% wash) and
         the per-tick left rules are both gone, leaving labels on a hairline
         — the reference mockup's shape. The bed was the only thing on this
         row carrying a fill, and against the deep lane blocks below it read
         as a fourth surface between the card and the tracks. */
      .ruler {
        position: relative;
        height: 30px;
        border-bottom: 1px solid var(--ring);
        cursor: ew-resize;
        touch-action: none;
      }
      /* Measured to the digits' ink, not the 16px line box: the font keeps
         room under the baseline for descenders that digits never use, so a
         box centred in the ruler puts the ink ~.5px low. On 2026-10-08 the
         ink was evened at 8.9px above and 8.8px below in a 28px ruler,
         which read cramped under the divider and the playhead's knob; the
         ruler grew 2px, all of it above the labels — ~10.9px above the
         ink, 8.8px below. */
      .ruler .tick {
        position: absolute;
        top: 7.5px;
        padding-left: 4px;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--ink-muted);
        line-height: 16px;
      }
      .ruler .tick[data-edge="end"] { transform: translateX(-100%); padding-left: 0; padding-right: 4px; }
      /* Would overlap the label before it — see `placeRulerLabels`. Hidden,
         not removed, so it keeps its width for the next measurement. */
      .ruler .tick[data-crowded] { visibility: hidden; }
      .ruler[data-source="captured"] { border-bottom-style: dashed; opacity: .8; }
      .lane { display: grid; grid-template-columns: var(--lane-label) 1fr; gap: var(--lane-gap); align-items: center; margin-top: 6px; }
      /* `.bar` and `.bar-report` — the hover report's row above the ruler,
         and the `:has()` rule that collapsed it when there was nothing to
         say — are gone with the report itself (2026-09-22). It is a card in
         the status row now; see `renderTakeNotes`. */
      /* `Snap` and `Fit`'s home, on `#transport`. */
      .bar-controls { display: flex; gap: 6px; }
      /* Each lane's hue, set on the ROW so the header's glyph and what is
         drawn in its track read one declaration. Three lanes: Clip is the
         olive the take itself plays on, Zoom is the camera's violet, and
         Mask is a red that reads as "redacted" at a glance. The beats ride
         the Clip track since 2026-09-22 and have no hue of their own. */
      .lane[data-lane="clip"] { --clip-fill: var(--lane-clip); --clip-ink: var(--lane-clip-ink); --glyph: var(--lane-clip-glyph); }
      .lane[data-lane="zoom"] { --clip-fill: var(--lane-zoom); --clip-ink: var(--lane-zoom-ink); --glyph: var(--lane-zoom-glyph); }
      .lane[data-lane="mask"] { --clip-fill: var(--lane-mask); --clip-ink: var(--lane-mask-ink); --glyph: var(--lane-mask-glyph); }
      /* A track's header: the lane's glyph in a grey disc, and the name in
         sentence case beside it. Until 2026-09-22 this was 10px uppercase
         grey text right-aligned against the track with a coloured dot before
         it, which read as a caption floating in an empty column. The header
         had a filled cell of its own for part of that day, dropped the same
         day: the disc gives the row its head without a second box beside
         the track. `align-self: stretch` with the track's 30px as a floor,
         so anything taller put in a header grows the row rather than
         overflowing it. */
      .lane-head {
        align-self: stretch;
        min-height: 30px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        /* Muted, the inspector's supporting-text tone: the header names the
           row, and the blocks in the track are what the eye should land on. */
        color: var(--ink-muted);
        font-size: 12px;
        font-weight: 600;
        min-width: 0;
      }
      .lane-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .lane-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* The glyph, in a disc of the track bed's grey. Drawn on the svg itself
         (padding inside a fixed box) rather than a wrapper, so `icon()`'s
         output goes in as it is. The hue is on the stroke, from the lane's
         own `--lane-*-glyph` (see `:root` for why not its fill). */
      .lane-glyph { position: relative; flex: none; display: flex; }
      .lane-head svg {
        flex: none;
        box-sizing: border-box;
        width: 22px;
        height: 22px;
        padding: 5px;
        border-radius: 50%;
        background: var(--track);
        color: var(--glyph);
      }
      .track { position: relative; height: 30px; background: var(--track); border-radius: 6px; overflow: hidden; }
      .degraded { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, transparent 0 4px, color-mix(in srgb, var(--warn) 45%, transparent) 4px 8px); }
      /* The trim handles, as caps on the Clip block's own ends. `.cut` — a
         pair of overlays shading what the trim removed — went with the bed
         they were drawn on: the block IS the kept range now, so the cut is
         the bare track either side and nothing has to paint it. */
      /* An estimated trim edge: hatched. Its visibility follows every other
         edge handle's (see `.handle, .cap` below), and its sentence is in the
         notes popover either way. */
      .handle[data-timing="estimated"] { background-image: repeating-linear-gradient(45deg, transparent 0 3px, rgba(255,255,255,.5) 3px 6px); }
      /* The beats, centred on the Clip track, one shape per verb. Scoped
         under the lane, not bare `.tick`: the ruler draws its own time
         labels in a `.tick` span (`.ruler .tick`, above), and a bare rule
         here would come after it in the cascade at LOWER specificity — a
         real conflict `noDescendingSpecificity` catches even though the two
         never share an element.

         Shape carries the verb, because a glyph is illegible at the 12px a
         beat can have: click a disc, type a rounded square (a key), a hover
         a hollow ring (the pointer only passing), a scroll a vertical pill,
         a wait a small diamond. Tone carries the kind, all within the Clip
         lane's own hue so a busy take does not become a rainbow: the inputs
         (click, type) in the lane's own ink and strongest, the pointer's
         movement (hover, scroll) a tint of the lane's green, a wait
         quietest of all. All three follow the theme: the block's fill is
         deep in dark and a pale tint in light, so the inputs are
         `--clip-ink` — white on the dark block, a near-black olive on the
         light one — the pointer tick is `--lane-clip-pointer`, pale in
         dark and a deep olive in light, and the wait is the ink mixed 60%
         into the fill. Computed from the tokens on the Clip block (light /
         dark): inputs 8.4 / 7.2:1, the pointer tint 4.3 / 5.1, the wait
         tone about 3.2 / 3.7 — each over the 3:1 a non-text mark needs,
         each a step below the last.

         Every mark wears a 2px ring of the lane's fill (`--tick-ring`), so
         on the bare track either side of a trim a white mark still has an
         edge against a light theme's light bed. A box-shadow rather than a
         border, so the ring never changes the shape's own size. */
      .lane[data-lane="clip"] {
        --tick-input: var(--clip-ink);
        --tick-pointer: var(--lane-clip-pointer);
        --tick-wait: color-mix(in srgb, var(--clip-ink) 60%, var(--clip-fill));
      }
      .lane[data-lane="clip"] .tick {
        --tick-ring: var(--clip-fill);
        position: absolute;
        top: 50%;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--tick-input);
        box-shadow: 0 0 0 2px var(--tick-ring);
        cursor: pointer;
        z-index: 4;
      }
      .lane[data-lane="clip"] .tick[data-verb="type"] { border-radius: 3px; }
      .lane[data-lane="clip"] .tick[data-verb="moveTo"] {
        background: var(--clip-fill);
        box-shadow: inset 0 0 0 2px var(--tick-pointer), 0 0 0 2px var(--tick-ring);
      }
      .lane[data-lane="clip"] .tick[data-verb="scrollTo"] {
        width: 8px;
        height: 14px;
        margin: -7px 0 0 -4px;
        border-radius: 4px;
        background: var(--tick-pointer);
      }
      /* A drag: an input, held — a pill, as wide as a press that travels. */
      .lane[data-lane="clip"] .tick[data-verb="drag"] {
        width: 16px;
        height: 10px;
        margin: -5px 0 0 -8px;
        border-radius: 5px;
      }
      .lane[data-lane="clip"] .tick[data-verb="waitFor"] {
        width: 9px;
        height: 9px;
        margin: -4.5px 0 0 -4.5px;
        border-radius: 2px;
        background: var(--tick-wait);
        transform: rotate(45deg);
      }
      /* A beat placed from the take's own timestamp rather than a render's
         marker: the whole mark at half strength. It was a diagonal hatch
         until 2026-09-22, which at 12px drew as a few stray stripes and read
         as a rendering fault rather than a state. */
      .lane[data-lane="clip"] .tick[data-not-in-video] { opacity: .5; }
      /* A cut step: the mark is hollow, because its frames are not in the
         video. After the verb rules so it wins, like the hover flag below. */
      .lane[data-lane="clip"] .tick[data-cut] {
        background: transparent;
        box-shadow: inset 0 0 0 2px var(--tick-input), 0 0 0 2px var(--tick-ring);
      }
      /* Ticks that resolve to ONE instant, fanned right so each stays
         clickable. A cut collapses its whole run onto the seam — and the
         surviving step the run closes on lands there too, on top, because
         ticks are appended in beat order. Every tick carries the offset,
         not just the cut ones, or the survivor still covers the first cut.
         `-6px` is the base rule's own centring half-width. */
      .lane[data-lane="clip"] .tick[data-stack-index] {
        margin-left: calc(var(--tick-nudge, -6px) + var(--tick-stack, 0) * 7px);
      }
      /* The verb rules above set a `margin` SHORTHAND at class+attribute
         specificity, so they re-set margin-left too and a plain `.tick`
         stacking rule lost to them — measured: a scrollTo tick stayed at
         -4px whatever its stack index, and sat on top of the cut beside it.
         The two verbs with their own centring half-width restate it here. */
      .lane[data-lane="clip"] .tick[data-verb="scrollTo"] { --tick-nudge: -4px; }
      .lane[data-lane="clip"] .tick[data-verb="waitFor"] { --tick-nudge: -4.5px; }
      .lane[data-lane="clip"] .tick[data-verb="drag"] { --tick-nudge: -8px; }
      /* A hover the pixel check says changed nothing: its ring goes amber,
         the colour the hover-check flag on the Clip glyph already uses for
         "look at this". It was a dashed ring, which is not a style a 12px
         circle can draw legibly. After the verb rules so it wins. */
      .lane[data-lane="clip"] .tick[data-flag="unchangedHover"] { --tick-ring: var(--warn); }
      .lane[data-lane="clip"] .tick[data-selected] { outline: 2px solid var(--ink); outline-offset: 3px; }
      /* Each tick carries its step's icon (`timeline-view.ts`); the studio's
         own sheet draws it, and this page keeps its shapes. */
      .lane[data-lane="clip"] .tick svg { display: none; }
      /* A block on its lane: the lane's fill, its ink, and the name of the
         thing in semibold. `top`/`bottom: 0` rather than a 3px inset — the
         track is the block's own height now (30px since 2026-10-07),
         so an inset would draw a bed frame around every segment. */
      .seg {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 6px;
        background: var(--clip-fill);
        /* The glyph colour edges the lighter fill: in light the fills are
           tints a little paler than the bed's neighbours, and the lane's own
           hue says whose block it is. */
        box-shadow: inset 0 0 0 1px var(--glyph);
        color: var(--clip-ink);
        font-size: 12px;
        font-weight: 600;
        padding: 0 10px;
        display: flex;
        align-items: center;
        /* Not clipped since 2026-09-22, so the edge handles' widened press
           area (`::after`) reaches a few pixels past the ends. The label
           clips itself (below). */
        white-space: nowrap;
        cursor: grab;
      }
      /* The block's label. A span rather than the segment's own text so it
         can be ellipsised independently of the caps and ghosts that share
         the box. */
      .seg-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      /* The take itself. Not draggable — its ends are the trim, and those
         are the `[data-trim]` handles — so it does not take `.seg`'s grab
         cursor, and its text is selected by neither. */
      .seg[data-kind="clip"] { cursor: default; }
      /* The clip's pieces (split tool, 2026-10-22; the mockup the author
         approved). A clip in one piece is the one block it always was: the
         piece is a clear hit area inside it. Split, the block hands its fill
         to the pieces, each its own rounded block 2px from its neighbours
         (as two touching zooms read), lit on its own under the pointer. */
      .piece-wrap { position: absolute; top: 0; bottom: 0; }
      .piece { position: absolute; inset: 0; padding: 0; border: 0; background: transparent; border-radius: 6px; cursor: pointer; z-index: 2; }
      .piece-wrap[data-selected] .piece::before { content: ""; position: absolute; inset: 0; border: 2px solid var(--ink); border-radius: 6px; pointer-events: none; }
      .seg[data-clip-block][data-pieces] { background: transparent; box-shadow: none; }
      [data-pieces] > .piece-wrap > .piece { margin: 0 1px; }
      [data-pieces] > .piece-wrap:first-child > .piece { margin-left: 0; }
      [data-pieces] > .piece-wrap:last-child > .piece { margin-right: 0; }
      [data-pieces] .piece { background: var(--clip-fill); }
      [data-pieces] > .piece-wrap:is(:hover, :has(> .edge[data-dragging])) > .piece,
      .track:has(> .handle[data-trim="head"]:is(:hover, [data-dragging])) [data-pieces] > .piece-wrap:first-child > .piece,
      .track:has(> .handle[data-trim="tail"]:is(:hover, [data-dragging])) [data-pieces] > .piece-wrap:last-child > .piece { background: var(--clip-fill-hover, var(--clip-fill)); }
      /* A piece's edge: the trim handle's bracket, just inside the piece's
         end, its grab reaching inward so two touching pieces never share a
         press. Shown under the pointer, on the selected piece, and held
         while dragged, when it says by how much the piece grows or shrinks. */
      .edge { position: absolute; top: 0; bottom: 0; width: 4px; background: var(--ink); cursor: ew-resize; touch-action: none; z-index: 3; opacity: 0; transition: opacity 120ms; }
      .edge[data-edge="start"] { left: 0; border-radius: 3px 0 0 3px; }
      .edge[data-edge="end"] { right: 0; border-radius: 0 3px 3px 0; }
      [data-pieces] > .piece-wrap:not(:first-child) > .edge[data-edge="start"] { left: 1px; }
      [data-pieces] > .piece-wrap:not(:last-child) > .edge[data-edge="end"] { right: 1px; }
      .edge::after { content: ""; position: absolute; top: 0; bottom: 0; }
      .edge[data-edge="start"]::after { left: -2px; right: -6px; }
      .edge[data-edge="end"]::after { left: -6px; right: -2px; }
      .piece-wrap:hover > .edge, .piece-wrap[data-selected] > .edge, .edge[data-dragging] { opacity: 1; }
      .edge[data-readout]::before { content: attr(data-readout); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); padding: 2px 6px; border-radius: 5px; background: var(--card); box-shadow: 0 0 0 1px var(--line); color: var(--ink); font-family: var(--mono, ui-monospace, monospace); font-size: 11px; white-space: nowrap; pointer-events: none; }
      /* The Clip lane lets its dots, its readout and a join's card out above
         it; the other lanes still clip to their bed. */
      .lane[data-lane="clip"] { margin-top: 14px; }
      .track[data-track="clip"] { overflow: visible; }
      /* Where a removed piece was: a line in the lane, a mark only, and a
         dot above the lane, the one thing to click — so the lane's height
         stays the handles'. Both take one `left` (timeline-view), so the dot
         is always centred on its line. */
      .seam { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--warn); opacity: 0.75; pointer-events: none; z-index: 5; }
      .join { position: absolute; top: -14px; width: 16px; height: 16px; margin-left: -8px; padding: 0; border: 0; background: none; cursor: pointer; z-index: 6; display: grid; place-items: center; }
      .join::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px var(--bg); transition: transform 100ms; }
      .join:is(:hover, :focus-visible, [aria-expanded="true"])::before { transform: scale(1.3); }
      /* The card a dot opens: how much, from where to where, and Restore. */
      .join-card { position: fixed; inset: auto; margin: 0; z-index: 30; display: flex; align-items: center; gap: 14px; width: max-content; padding: 10px 10px 10px 12px; border: 0; border-radius: 10px; background: var(--card); box-shadow: 0 0 0 1px var(--line), var(--shadow-overlay); color: var(--ink); cursor: default; overflow: visible; }
      .join-card::after { content: ""; position: absolute; left: var(--arrow, 50%); bottom: -5px; width: 10px; height: 10px; margin-left: -5px; background: var(--card); transform: rotate(45deg); box-shadow: 1px 1px 0 0 var(--line); }
      .join-card-what { display: grid; gap: 2px; max-width: 280px; }
      .join-card-what b { font-weight: 500; font-size: 12.5px; }
      .join-card-what span { font-family: var(--mono, ui-monospace, monospace); font-size: 11px; color: var(--ink-4, var(--ink-2)); font-variant-numeric: tabular-nums; }
      .join-card-restore { font: inherit; font-size: 12.5px; font-weight: 500; border: 0; cursor: pointer; padding: 6px 12px; border-radius: 999px; background: var(--ink); color: var(--bg); }
      .join-card-restore:hover { opacity: 0.9; }
      .seg[data-timing="estimated"] { background-image: repeating-linear-gradient(45deg, transparent 0 4px, color-mix(in srgb, var(--clip-ink) 22%, transparent) 4px 8px); }
      /* The scale reads in the middle of the zoom it belongs to — when
         there is a middle to read it in. A zoom is `MIN_CLIP_FRACTION`
         wide at its narrowest (0.6% of the track, ~5px), and even an
         ordinary one draws ~25px at a full-take viewport, which is under
         "1.8x" plus this rule's 20px of padding — so most zooms still show
         the label from the left, and only a wide one centres it.

         Plain `center`, not `safe center`: that was tried, and the padding
         makes it moot. Half the label's worst-case overflow is under 10px,
         so the side padding absorbs it and the text never runs off the
         segment's own start edge whichever keyword is used. Masks stay
         start-aligned — "mask · whole take" is long enough that centring
         would never apply to them. */
      .seg[data-kind="zoom"] { justify-content: center; }
      .seg[data-outside-trim] { opacity: .35; }
      .seg[data-clamped="true"] { box-shadow: inset 0 0 0 2px var(--warn); }
      /* The selection ring: a 2px ink border just inside the block, on all
         four sides. It was an `outline` until 2026-09-22, standing 3px off
         every side — and `.track` clips at its own box, which a block
         fills top to bottom, so the outline's top and bottom never drew:
         what showed was its two sides, bulging 3px past the edge handles
         once those moved inside the block's ends. Drawn inside, nothing
         clips it, all four sides show, and the ends land on the handles. */
      .seg[data-selected] { z-index: 1; }
      .seg[data-selected]::before {
        content: "";
        position: absolute;
        inset: 0;
        border: 2px solid var(--ink);
        border-radius: 6px;
        pointer-events: none;
      }
      /* The hover ghost: where a click on empty track would put a new segment. Out of the pointer's way, so the click beneath it still lands on the track. */
      .seg[data-ghost] { opacity: .4; pointer-events: none; border: 1px dashed var(--clip-ink); }
      /* A segment widened past its own span to stay clickable (`boxOf`'s
         `minWidth`) still says so: without this a zoom-dependent lie never
         reads as timing (spec, 2026-09-03), and `MIN_CLIP_FRACTION`'s
         docblock promises exactly this marker. Carried over from the old
         `.clip[data-to-scale="false"]::after` rule. */
      .seg[data-to-scale="false"]::after { content: "·"; position: absolute; right: 1px; top: 0; opacity: .6; }
      /* Every block's edge handle — the Clip lane's trim (`.handle`) and a
         zoom's or mask's ends (`.cap`) — is one handle since 2026-09-22: a
         4px ink bar just inside the block's end, flush with its edge. Until
