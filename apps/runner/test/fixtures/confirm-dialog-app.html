<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Project settings</title>
    <style>
      body { font: 16px system-ui, sans-serif; margin: 40px; }
      button { font: inherit; margin: 8px 0; padding: 6px 10px; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <!-- A click that opens confirm(). OK shows #undo, Cancel shows #kept, so
         the page says which answer the run gave; nothing appears while the
         dialog is still open. -->
    <h1>Northwind</h1>
    <button type="button" id="delete">Delete project</button>
    <p id="answer"></p>
    <button type="button" id="undo" hidden>Undo delete</button>
    <button type="button" id="kept" hidden>Project kept</button>
    <!-- Below the rest, so nothing above moves. #delete-later asks after
         its click has returned (a timer, as after a fetch); #save's alert
         comes 300 ms after its click. -->
    <button type="button" id="delete-later">Delete account</button>
    <button type="button" id="save">Save</button>
    <script>
      const answered = (ok) => {
        document.getElementById("answer").textContent = `confirm() answered ${ok}`;
        document.getElementById(ok ? "undo" : "kept").hidden = false;
      };
      document.getElementById("delete").addEventListener("click", () => {
        answered(confirm("Delete Northwind?"));
      });
      document.getElementById("delete-later").addEventListener("click", () => {
        setTimeout(() => answered(confirm("Delete account?")), 0);
      });
      document.getElementById("save").addEventListener("click", () => {
        setTimeout(() => alert("Saved"), 300);
      });
    </script>
  </body>
</html>
