<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fields</title>
<style>body{margin:0;padding:24px;font:16px system-ui,sans-serif}input{display:block;margin:0 0 16px;width:240px;height:32px}</style>
</head>
<body>
  <!-- #fmt rewrites digits as "4,800" as they go in; #wipe empties itself. -->
  <input id="fmt" type="text">
  <input id="wipe" type="text">
  <input id="plain" type="text">
  <label id="wrap">Amount <input id="inner" type="text"></label>
  <!-- A code box: once it holds a character, focus moves to the next box. -->
  <input id="code1" type="text" maxlength="1">
  <input id="code2" type="text" maxlength="1">
  <!-- Draws no animation frame for 1.5 s after a key: past the 1 s the type
       verb waits for its last key's paint. -->
  <input id="frozen" type="text">
  <!-- Navigates on its first key: the document the key went into is gone. -->
  <input id="leave" type="text">
  <!-- Its second frame after a key comes 600 ms late (that frame busy-waits
       first): the type verb waits two frames after its last key.
       Measured 2026-11-24 at 300 ms: the act lasted 297 ms longer than the
       same key on a plain field with the wait, and no longer without it. -->
  <input id="slowpaint" type="text">
  <script>
    document.getElementById("fmt").addEventListener("input", (e) => {
      const digits = e.target.value.replace(/\D/g, "");
      e.target.value = digits.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    });
    document.getElementById("wipe").addEventListener("input", (e) => {
      e.target.value = "";
    });
    // The page's own requestAnimationFrame, saved once: saved per key, the
    // second key would save the no-op and the last restore put it back.
    const raf = window.requestAnimationFrame;
    let frozenUntil = 0;
    document.getElementById("frozen").addEventListener("input", () => {
      window.requestAnimationFrame = () => 0;
      frozenUntil = performance.now() + 1500;
      setTimeout(() => {
        if (performance.now() >= frozenUntil) window.requestAnimationFrame = raf;
      }, 1500);
    });
    document.getElementById("slowpaint").addEventListener("input", () => {
      raf(() =>
        raf(() => {
          const t = performance.now();
          while (performance.now() - t < 600) {}
        }),
      );
    });
    document.getElementById("leave").addEventListener("input", () => {
      location.replace(location.href.split("?")[0] + "?left=1");
    });
    document.getElementById("code1").addEventListener("input", (e) => {
      if (e.target.value.length >= 1) document.getElementById("code2").focus();
    });
  </script>
</body>
</html>
